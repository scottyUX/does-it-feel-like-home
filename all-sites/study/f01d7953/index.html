<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>家味餐厅 - 温暖的浙江味道</title>
    <style>
        body {font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin:0; background:#f9f9f9; color:#333;}
        a {text-decoration:none; color:#333;}
        header {background:#fff; border-bottom:1px solid #e0e0e0;}
        .nav {max-width:1200px; margin:auto; display:flex; align-items:center; justify-content:space-between; padding:15px;}
        .logo {font-size:24px; font-weight:bold; color:#d9534f;}
        .menu {display:flex; gap:20px;}
        .menu a {padding:5px 10px; font-size:16px;}
        .menu a:hover {color:#d9534f;}
        .hero {background:url('assets/image-350b4d488bd05d9b.jpg'); background-size:cover; background-position:center; height:400px; position:relative; color:#fff;}
        .hero::after {content:""; position:absolute; inset:0; background:rgba(0,0,0,0.4);}
        .hero-text {position:absolute; bottom:30px; left:30px; z-index:1;}
        .hero-text h1 {font-size:48px; margin:0;}
        .hero-text p {font-size:20px; margin-top:10px;}
        .section {max-width:1200px; margin:auto; padding:40px 20px;}
        .section h2 {font-size:32px; margin-bottom:20px; color:#d9534f;}
        .footer {background:#333; color:#fff; text-align:center; padding:20px; font-size:14px;}
        @media (max-width:768px){
            .nav {flex-direction:column; align-items:flex-start;}
            .menu {flex-direction:column; gap:10px;}
            .hero-text h1 {font-size:32px;}
            .hero-text p {font-size:16px;}
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <div class="logo">家味餐厅</div>
            <nav class="menu">
                <a href="index.html">首页</a>
                <a href="menu.html">菜品菜单</a>
                <a href="about.html">关于我们</a>
                <a href="reservation.html">预订座位</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>欢迎光临家味餐厅</h1>
            <p>正宗浙江家常味，温暖每一次相聚</p>
        </div>
    </section>

    <section class="section">
        <h2>我们的特色</h2>
        <p>家味餐厅位于美丽的杭州西湖区，是一家由三代人共同经营的家庭式餐厅。我们坚持使用本地新鲜食材，传承浙江传统烹饪技艺，让每一道菜都带有家的温度。</p>
        <p>无论是本地居民、上班族还是远道而来的游客，都能在这里找到熟悉而惊喜的味道。我们提供宽敞的用餐环境，适合家庭聚餐、商务午餐以及朋友小聚。</p>
    </section>

    <footer class="footer">
