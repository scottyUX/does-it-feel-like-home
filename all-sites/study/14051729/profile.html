<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>趣聊 - 我的主页</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#333;}
        .navbar{background:#fff;padding:10px 20px;display:flex;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        .navbar a{margin-right:20px;color:#333;text-decoration:none;font-weight:bold;}
        .navbar a:hover{color:#ff5a5f;}
        .container{max-width:1200px;margin:auto;padding:20px;}
        .profile-header{background:#fff;padding:20px;border-radius:8px;display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);}
        .avatar{width:80px;height:80px;border-radius:50%;background:#ccc;margin-right:20px;}
        .info{flex:1;}
        .info h2{margin:0;}
        .info p{margin:5px 0;color:#666;}
        .edit-btn{background:#ff5a5f;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
        .edit-btn:hover{background:#e04e52;}
        .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin-top:20px;}
        .post-thumb{background:#fff;padding:10px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.1);}
        .post-thumb img{width:100%;height:180px;object-fit:cover;border-radius:6px;}
        .footer{text-align:center;padding:20px;color:#777;font-size:14px;}
        @media(max-width:768px){
            .navbar{flex-direction:column;align-items:flex-start;}
            .navbar a{margin-bottom:5px;}
            .profile-header{flex-direction:column;align-items:center;}
            .avatar{margin-bottom:10px;}
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">首页</a>
        <a href="profile.html">我的主页</a>
        <a href="signup.html">注册</a>
    </nav>
    <div class="container">
        <div class="profile-header">
            <div class="avatar"></div>
            <div class="info">
                <h2>张伟</h2>
                <p>热爱旅行和摄影，喜欢记录生活的点滴。</p>
                <button class="edit-btn">编辑个人资料</button>
            </div>
        </div>

        <h3>我的动态</h3>
        <div class="posts-grid">
            <div class="post-thumb"><img src="assets/image-f133476839c86a8c.jpg" alt="thumb"></div>
            <div class="post-thumb"><img src="assets/image-19920bc7d3b2d1da.jpg" alt="thumb"></div>
            <div class="post-thumb"><img src="assets/image-70d5436212a4e077.jpg" alt="thumb"></div>
        </div>
    </div>

    <footer class="footer">
        © 2026 趣聊. 保留所有权利。
    </footer>
</body>
</html>
