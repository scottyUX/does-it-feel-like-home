<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>快送外卖 - 订单确认</title>
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#333}
        header{background:#ff6600;color:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}
        header h1{margin:0;font-size:1.2em}
        nav a{color:#fff;margin-left:20px;text-decoration:none;font-weight:bold}
        .container{max-width:800px;margin:auto;padding:20px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.1);border-radius:8px;margin-top:30px}
        h2{margin-top:0}
        table{width:100%;border-collapse:collapse;margin-top:15px}
        th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
        th{background:#f0f0f0}
        .total{font-weight:bold;font-size:1.1em;text-align:right}
        .actions{text-align:right;margin-top:20px}
        button{background:#ff6600;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer}
        button:hover{background:#e65500}
        .empty{text-align:center;color:#777;padding:30px 0}
        footer{background:#333;color:#fff;text-align:center;padding:15px;margin-top:30px}
        a{color:inherit;text-decoration:none}
    </style>
</head>
<body>
<header>
    <h1>订单确认</h1>
    <nav>
        <a href="index.html">首页</a>
        <a href="restaurants.html">餐厅列表</a>
    </nav>
</header>

<div class="container" id="orderContainer">
    <!-- 动态内容 -->
</div>

<footer>
    © 2026 快送外卖
</footer>

<script>
    const container = document.getElementById('orderContainer');
    const cart = JSON.parse(localStorage.getItem('cart')||'[]');

    if (cart.length===0){
        container.innerHTML = '<p class="empty">购物车为空，请先选择菜品。</p>';
    }else{
        let rows = '';
        let total = 0;
        cart.forEach(item=>{
            const subtotal = item.price*item.qty;
            total += subtotal;
            rows+=`
                <tr>
                    <td>${item.name}</td>
                    <td>¥${item.price.toFixed(2)}</td>
                    <td>${item.qty}</td>
                    <td>¥${subtotal.toFixed(2)}</td>
                </tr>
            `;
        });
        container.innerHTML = `
            <h2>您的订单</h2>
            <table>
                <thead>
                    <tr><th>菜品</th><th>单价</th><th>数量</th><th>小计</th></tr>
                </thead>
                <tbody>
                    ${rows}
                </tbody>
                <tfoot>
                    <tr><td colspan="3" class="total">合计</td><td class="total">¥${total.toFixed(2)}</td></tr>
                </tfoot>
            </table>
            <div class="actions">
                <button onclick="confirmOrder()">确认下单</button>
                <button style="margin-left:10px;background:#777" onclick="clearCart()">清空购物车</button>
            </div>
        `;
    }

    function confirmOrder(){
        alert('订单已确认！我们将尽快为您配送。');
        localStorage.removeItem('cart');
        location.reload();
    }

    function clearCart(){
        if (confirm('确定要清空购物车吗？')){
            localStorage.removeItem('cart');
            location.reload();
        }
    }
</script>
</body>
</html>
