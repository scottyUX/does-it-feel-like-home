<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部商品 - 可衣</title>
    <style>
        :root {
            --primary-color: #a6937c;
            --bg-color: #faf9f6;
            --text-color: #333;
            --light-text: #666;
            --white: #ffffff;
            --border-color: #e0e0e0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
        }
        .page-header {
            text-align: center;
            padding: 60px 0 40px;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 10px;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .filter-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--light-text);
            border-radius: 20px;
        }
        .filter-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #fdfbf8;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 80px;
        }
        .product-card {
            background-color: var(--white);
            border: 1px solid #eee;
            transition: box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .product-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .product-image {
            height: 380px;
            background-color: #eee;
            position: relative;
        }
        .product-info {
            padding: 20px;
            text-align: center;
        }
        .product-name {
            font-size: 18px;
            margin-bottom: 10px;
            color: #444;
        }
        .product-price {
            font-size: 16px;
            color: var(--primary-color);
            font-weight: 500;
        }
        .tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary-color);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 2px;
        }
        footer {
            background-color: #f0efed;
            padding: 60px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--light-text);
        }
        .footer-links {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .footer-links a {
            color: var(--light-text);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">可衣 KĚ YĪ</a>
                <div class="nav-links">
                    <a href="index.html">首页</a>
                    <a href="shop.html">全部商品</a>
                    <a href="about.html">关于我们</a>
                    <a href="cart.html">购物车</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>精选商品</h1>
            <p>为您挑选的都市通勤与居家好物</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active">全部</button>
            <button class="filter-btn">上衣</button>
            <button class="filter-btn">下装</button>
            <button class="filter-btn">连衣裙</button>
            <button class="filter-btn">外套</button>
        </div>

        <div class="product-grid">
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #e8e4e0;">
                    <span class="tag">热门</span>
                </div>
                <div class="product-info">
                    <div class="product-name">极简主义白色真丝衬衫</div>
                    <div class="product-price">¥ 459.00</div>
                </div>
            </a>
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #d9e0d9;">
                </div>
                <div class="product-info">
                    <div class="product-name">莫兰迪色高腰直筒西裤</div>
                    <div class="product-price">¥ 389.00</div>
                </div>
            </a>
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #eaded5;">
                    <span class="tag">新品</span>
                </div>
                <div class="product-info">
                    <div class="product-name">法式复古碎花茶歇裙</div>
                    <div class="product-price">¥ 520.00</div>
                </div>
            </a>
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #d3d3d3;">
                </div>
                <div class="product-info">
                    <div class="product-name">羊绒混纺极简针织衫</div>
                    <div class="product-price">¥ 680.00</div>
                </div>
            </a>
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #ede7dc;">
                </div>
                <div class="product-info">
                    <div class="product-name">米色宽松廓形西装外套</div>
                    <div class="product-price">¥ 890.00</div>
                </div>
            </a>
            <a href="product.html" class="product-card">
                <div class="product-image" style="background-color: #f2f2f2;">
                </div>
                <div class="product-info">
                    <div class="product-name">基础款修身白色T恤</div>
                    <div class="product-price">¥ 159.00</div>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="about.html">品牌故事</a>
                <a href="#">配送政策</a>
                <a href="#">退换货指南</a>
                <a href="#">联系我们</a>
            </div>
            <p>&copy; 2024 可衣 (KĚ YĪ) 上海工作室. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
