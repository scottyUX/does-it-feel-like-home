<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>预约清洁 - 洁家家政</title>
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f9f9f9;color:#333;}
        header{background:#2c7be5;color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;}
        header h1{margin:0;font-size:24px;}
        nav a{color:#fff;margin-left:20px;text-decoration:none;font-size:16px;}
        nav a:hover{opacity:0.8;}
        .content{max-width:800px;margin:30px auto;background:#fff;padding:40px;border-radius:8px;}
        h2{font-size:28px;margin-bottom:20px;}
        form{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        label{display:block;font-weight:bold;margin-bottom:5px;}
        input, select, textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;}
        textarea{resize:vertical;height:100px;}
        .full{grid-column:1 / -1;}
        .submit{background:#ffb400;color:#333;padding:12px 20px;border:none;border-radius:4px;font-size:16px;cursor:pointer;}
        .submit:hover{background:#e6a200;}
        .note{font-size:14px;color:#777;margin-top:10px;}
        footer{background:#333;color:#ccc;padding:20px 40px;text-align:center;font-size:14px;margin-top:40px;}
        @media(max-width:600px){
            header{flex-direction:column;align-items:flex-start;}
            nav{margin-top:10px;}
            form{grid-template-columns:1fr;}
        }
    </style>
    <script>
        function submitForm(event){
            event.preventDefault();
            alert('感谢您的预约，我们将尽快联系您！');
            // Reset form fields
            document.getElementById('bookingForm').reset();
        }
    </script>
</head>
<body>
<header>
    <h1>洁家家政</h1>
    <nav>
        <a href="index.html">首页</a>
        <a href="services.html">服务项目</a>
        <a href="about.html">关于我们</a>
        <a href="booking.html">预约清洁</a>
    </nav>
</header>

<div class="content">
    <h2>在线预约清洁服务</h2>
    <form id="bookingForm" onsubmit="submitForm(event)">
        <div>
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
        </div>
        <div>
            <label for="phone">手机号码</label>
            <input type="tel" id="phone" name="phone" placeholder="请输入手机号码" required pattern="[0-9]{11}">
        </div>
        <div class="full">
            <label for="address">服务地址</label>
            <input type="text" id="address" name="address" placeholder="北京市朝阳区..." required>
        </div>
        <div>
            <label for="date">预约日期</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div>
            <label for="time">预约时间段</label>
            <select id="time" name="time" required>
                <option value="">请选择时间段</option>
                <option>08:00 - 12:00</option>
                <option>12:00 - 16:00</option>
                <option>16:00 - 20:00</option>
            </select>
        </div>
        <div class="full">
            <label for="package">选择套餐</label>
            <select id="package" name="package" required>
                <option value="">请选择套餐</option>
                <option>基础清洁套餐 - ¥120 / 次</option>
                <option>深度清洁套餐 - ¥260 / 次</option>
                <option>全屋保洁（每周） - ¥800 / 月</option>
                <option>全屋保洁（每两周） - ¥450 / 月</option>
                <option>增值专项服务（自定义）</option>
            </select>
        </div>
        <div class="full">
            <label for="remarks">备注（可填写特殊需求）</label>
            <textarea id="remarks" name="remarks" placeholder="例如：宠物、特殊清洁部位等"></textarea>
        </div>
        <div class="full" style="text-align:center;">
            <button type="submit" class="submit">提交预约</button>
        </div>
        <p class="note full">我们承诺将在24小时内与您取得联系确认预约详情。</p>
    </form>
</div>

<footer>
    © 2026 洁家家政 | 北京市朝阳区建国路88号 | 电话：010-1234-5678
</footer>
</body>
</html>
