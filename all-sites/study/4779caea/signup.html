<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费注册 - 学途</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #1a202c; line-height: 1.6; background: #f8fafc; }
        a { text-decoration: none; color: inherit; }

        .nav { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 24px; font-weight: 700; color: #1e40af; }
        .nav-logo span { color: #f59e0b; }
        .nav-links { display: flex; gap: 32px; align-items: center; }
        .nav-links a { font-size: 15px; color: #4a5568; transition: color .2s; }
        .nav-links a:hover { color: #1e40af; }
        .nav-cta { background: #1e40af; color: #fff !important; padding: 8px 20px; border-radius: 6px; font-weight: 500; }
        .nav-cta:hover { background: #1e3a8a; }

        .signup-wrap { max-width: 480px; margin: 60px auto; padding: 0 20px; }
        .signup-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.06); padding: 40px; }
        .signup-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .signup-card .sub { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 32px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color .2s, box-shadow .2s; background: #fff; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1e40af; box-shadow: 0 0 0 3px rgba(30,64,175,.1); }
        .form-group input::placeholder { color: #9ca3af; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .check-group { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 24px; }
        .check-group input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: #1e40af; }
        .check-group label { font-size: 13px; color: #64748b; line-height: 1.5; }
        .check-group a { color: #1e40af; }

        .submit-btn { width: 100%; padding: 14px; background: #1e40af; color: #fff; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background .2s; font-family: inherit; }
        .submit-btn:hover { background: #1e3a8a; }

        .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { font-size: 12px; color: #94a3b8; }

        .social-btn { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: background .2s; }
        .social-btn:hover { background: #f8fafc; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
        .footer-link a { color: #1e40af; font-weight: 500; }

        /* Trust */
        .trust-section { max-width: 480px; margin: 32px auto 0; padding: 0 20px; }
        .trust-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; }
        .trust-item .icon { font-size: 20px; }
        .trust-item .text { font-size: 13px; color: #4a5568; }
        .trust-item .text strong { display: block; font-size: 14px; color: #1a202c; }

        .footer { background: #0f172a; color: #94a3b8; padding: 40px 40px 24px; margin-top: 60px; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; max-width: 1200px; margin: 0 auto 28px; }
        .footer h4 { color: #fff; font-size: 14px; margin-bottom: 14px; }
        .footer a { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .footer a:hover { color: #fff; }
        .footer-bottom { border-top: 1px solid #1e293b; padding-top: 20px; text-align: center; font-size: 12px; max-width: 1200px; margin: 0 auto; }

        @media (max-width: 600px) {
            .nav { padding: 0 16px; }
            .nav-links a:not(.nav-cta) { display: none; }
            .form-row { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-logo">学<span>途</span></a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="courses.html">课程中心</a>
            <a href="course-detail.html">课程详情</a>
            <a href="signup.html" class="nav-cta">免费注册</a>
        </div>
    </nav>

    <div class="signup-wrap">
        <div class="signup-card">
            <h1>创建你的学途账号</h1>
            <p class="sub">注册即享 3 节免费试听课，无需绑定支付方式</p>

            <form onsubmit="return false;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" placeholder="你的姓名">
                    </div>
                    <div class="form-group">
                        <label for="phone">手机号</label>
                        <input type="tel" id="phone" placeholder="11 位手机号">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" placeholder="example@university.edu.cn">
                </div>

                <div class="form-group">
                    <label for="password">设置密码</label>
                    <input type="password" id="password" placeholder="至少 8 位，含字母和数字">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="identity">身份</label>
                        <select id="identity">
                            <option value="">请选择</option>
                            <option>在校大学生</option>
                            <option>研究生 / 博士</option>
                            <option>应届毕业生</option>
                            <option>职场新人（1-3 年）</option>
                            <option>其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goal">学习目标</label>
                        <select id="goal">
                            <option value="">请选择</option>
                            <option>语言能力提升</option>
                            <option>编程 / 数据技能</option>
                            <option>考试备考</option>
                            <option>职场技能拓展</option>
                            <option>兴趣学习</option>
                        </select>
                    </div>
                </div>

                <div class="check-group">
                    <input type="checkbox" id="agree" checked>
                    <label for="agree">我已阅读并同意 <a href="#">《用户服务协议》</a>和 <a href="#">《隐私政策》</a></label>
                </div>

                <button type="submit" class="submit-btn" onclick="alert('注册功能即将上线，敬请期待！')">创建账号</button>
            </form>

            <div class="divider"><span>或</span></div>

            <button class="social-btn" onclick="alert('第三方登录即将开放，敬请期待！')">📱 微信扫码注册</button>

            <p class="footer-link">已有账号？<a href="#">直接登录</a></p>
        </div>

        <div class="trust-section">
            <div class="trust-item">
                <span class="icon">🔒</span>
                <div class="text"><strong>信息加密存储</strong>你的个人信息经加密处理，不会用于任何第三方营销。</div>
            </div>
            <div class="trust-item">
                <span class="icon">🎓</span>
                <div class="text"><strong>免费试听</strong>注册后可免费试听任意 3 节核心课，不满意不扣费。</div>
            </div>
            <div class="trust-item">
                <span class="icon">↩️</span>
                <div class="text"><strong>无忧退款</strong>正式课程开课后 48 小时内可无理由全额退款。</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-grid">
            <div>
                <h4>学途</h4>
                <p style="font-size:13px;line-height:1.7;margin-top:8px;">专注于为大学生和职场新人提供高质量在线学习体验。</p>
            </div>
            <div>
                <h4>课程</h4>
                <a href="courses.html">语言学习</a>
                <a href="courses.html">计算机技能</a>
                <a href="courses.html">考试备考</a>
            </div>
            <div>
                <h4>关于</h4>
                <a href="index.html">关于我们</a>
                <a href="index.html">师资介绍</a>
            </div>
            <div>
                <h4>帮助</h4>
                <a href="index.html">常见问题</a>
                <a href="index.html">退款政策</a>
                <a href="index.html">联系顾问</a>
            </div>
        </div>
        <div class="footer-bottom">© 2025 学途教育科技有限公司 · 保留所有权利</div>
    </footer>
</body>
</html>
