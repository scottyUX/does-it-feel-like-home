<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>快送外卖 - 餐厅列表</title>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#333;}
        header{background:#ff5722;color:#fff;padding:15px 30px;display:flex;align-items:center;justify-content:space-between;}
        header h1{margin:0;font-size:24px;}
        nav a{color:#fff;margin:0 10px;text-decoration:none;}
        .container{max-width:1200px;margin:auto;padding:20px;}
        .restaurant{background:#fff;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);display:flex;margin-bottom:20px;overflow:hidden;}
        .restaurant img{width:200px;height:150px;object-fit:cover;}
        .info{flex:1;padding:15px;display:flex;flex-direction:column;justify-content:space-between;}
        .info h2{margin:0 0 10px;}
        .info .meta{color:#777;font-size:14px;margin-bottom:10px;}
        .info button{align-self:flex-start;background:#ff5722;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
        footer{background:#333;color:#ccc;padding:15px;text-align:center;font-size:14px;}
        @media(max-width:800px){
            .restaurant{flex-direction:column;}
            .restaurant img{width:100%;height:auto;}
        }
    </style>
    <script>
        function filterByCategory(hash){
            const category = decodeURIComponent(hash.replace('#',''));
            document.getElementById('title').textContent = category ? category + ' 餐厅' : '全部餐厅';
        }
        window.addEventListener('load',()=>{
            filterByCategory(location.hash);
        });
        window.addEventListener('hashchange',()=>{filterByCategory(location.hash);});
    </script>
</head>
<body>
<header>
    <h1>快送外卖</h1>
    <nav>
        <a href="index.html">首页</a>
        <a href="list.html">餐厅列表</a>
        <a href="order.html">我的订单</a>
    </nav>
</header>
<div class="container">
    <h2 id="title">全部餐厅</h2>

    <div class="restaurant">
        <img src="data:image/svg+xml,%3Csvg%20width%3D%22200%22%20height%3D%22150%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20fill%3D%22%23ff8a65%22%20width%3D%22200%22%20height%3D%22150%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2285%22%20font-size%3D%2228%22%20fill%3D%22%23fff%22%3E川菜馆%3C/text%3E%3C/svg%3E" alt="川菜馆">
        <div class="info">
            <h2>川味坊</h2>
            <div class="meta">中餐 · 5.8公里 · 约30分钟送达 · 评分 4.5</div>
            <p>主打正宗川菜，麻辣鲜香，学生党优惠套餐。</p>
            <button onclick="location.href='restaurant.html?rid=1'">查看菜单</button>
        </div>
    </div>

    <div class="restaurant">
        <img src="data:image/svg+xml,%3Csvg%20width%3D%22200%22%20height%3D%22150%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20fill%3D%22%239c27b0%22%20width%3D%22200%22%20height%3D%22150%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2285%22%20font-size%3D%2228%22%20fill%3D%22%23fff%22%3E西餐厅%3C/text%3E%3C/svg%3E" alt="西餐厅">
        <div class="info">
            <h2>意式小镇</h2>
            <div class="meta">西餐 · 3.2公里 · 约25分钟送达 · 评分 4.2</div>
            <p>意大利面、披萨、红酒套餐，适合办公室聚餐。</p>
            <button onclick="location.href='restaurant.html?rid=2'">查看菜单</button>
        </div>
    </div>

    <div class="restaurant">
        <img src="data:image/svg+xml,%3Csvg%20width%3D%22200%22%20height%3D%22150%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20fill%3D%22%2361a0d0%22%20width%3D%22200%22%20height%3D%22150%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2285%22%20font-size%3D%2228%22%20fill%3D%22%23fff%22%3E小吃%3C/text%3E%3C/svg%3E" alt="小吃">
        <div class="info">
            <h2>学生小吃铺</h2>
            <div class="meta">小吃 · 1.5公里 · 约20分钟送达 · 评分 4.0</div>
            <p>炸鸡、烤串、奶茶，一人份超值套餐。</p>
            <button onclick="location.href='restaurant.html?rid=3'">查看菜单</button>
        </div>
    </div>
</div>
<footer>
    © 2026 快送外卖 | 成都市 | 联系电话：400-123-4567
</footer>
</body>
</html>
