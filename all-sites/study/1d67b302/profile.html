<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 趣聊</title>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --text-main: #1F2937;
            --text-light: #6B7280;
            --bg-body: #F9FAFB;
            --bg-card: #FFFFFF;
            --border: #E5E7EB;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: inherit; transition: 0.2s; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 15px 0; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--text-main); }
        .nav-links { display: flex; gap: 30px; }
        .nav-item:hover { color: var(--primary); }
        .btn { padding: 10px 20px; border-radius: var(--radius); font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-block; text-align: center;}
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--border); background: transparent; color: var(--text-main); }

        /* Profile Header */
        .profile-header { background: var(--bg-card); border-radius: var(--radius); padding: 40px 30px; margin-top: 30px; box-shadow: var(--shadow); text-align: center; }
        .profile-cover { width: 100%; height: 200px; background: linear-gradient(to right, #818CF8, #C084FC); border-radius: var(--radius) var(--radius) 0 0; margin: -40px -30px 0 -30px; }
        .profile-info { position: relative; margin-top: -50px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; background: #fff; padding: 4px; border: 4px solid var(--bg-card); box-shadow: var(--shadow); }
        .profile-avatar-inner { width: 100%; height: 100%; background: #3B82F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold;}
        .profile-name h2 { font-size: 1.8rem; margin-bottom: 5px; }
        .profile-bio { color: var(--text-light); max-width: 500px; }
        .profile-stats { display: flex; gap: 40px; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-num { font-weight: 700; font-size: 1.2rem; display: block; }
        .stat-label { font-size: 0.9rem; color: var(--text-light); }
        .profile-actions { margin-top: 20px; display: flex; gap: 15px; justify-content: center; }

        /* Tabs */
        .tabs { display: flex; justify-content: center; border-bottom: 1px solid var(--border); margin-top: 30px; margin-bottom: 30px; }
        .tab-item { padding: 15px 30px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
        .tab-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Post Grid */
        .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .grid-post { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; background: #E5E7EB; cursor: pointer; transition: 0.3s; }
        .grid-post:hover { opacity: 0.9; }
        .grid-post-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 1.1rem;}

        /* Footer */
        .footer { background: var(--bg-card); border-top: 1px solid var(--border); padding: 40px 0; margin-top: auto; text-align: center; color: var(--text-light); }

        @media (max-width: 767px) {
            .profile-cover { height: 150px; }
            .post-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .grid-post-cover { font-size: 0.8rem; }
            .profile-info { margin-top: -30px; }
            .profile-avatar { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">
                <div style="width: 30px; height: 30px; background: var(--primary); border-radius: 8px;"></div>
                <span>趣聊</span>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">首页</a>
                <a href="post.html" class="nav-item">帖子</a>
                <a href="profile.html" class="nav-item" style="color: var(--primary);">我的</a>
                <a href="#" class="nav-item">消息</a>
            </nav>
            <div>
                <a href="register.html" class="btn btn-primary">注册</a>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="profile-header">
            <div class="profile-cover"></div>
            <div class="profile-info">
                <div class="profile-avatar">
                    <div class="profile-avatar-inner">L</div>
                </div>
                <div class="profile-name">
                    <h2>林小北</h2>
                    <p class="profile-bio">摄影爱好者 / 旅行 / 记录生活 | 寻找城市里的美好角落 📸</p>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-num">1.2k</span>
                        <span class="stat-label">帖子</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">5.6k</span>
                        <span class="stat-label">关注</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">28k</span>
                        <span class="stat-label">粉丝</span>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn btn-primary">编辑资料</button>
                    <button class="btn btn-outline">分享主页</button>
                </div>
            </div>
        </section>

        <div class="tabs">
            <div class="tab-item active">动态</div>
            <div class="tab-item">收藏</div>
            <div class="tab-item">赞过</div>
        </div>

        <div class="post-grid">
            <div class="grid-post"><div class="grid-post-cover" style="background: #FFB7B2;">露营日记</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #A7E2EB;">城市街景</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #B0E5C7;">美食探店</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #E0BBE4;">自拍日常</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #957DAD;">日落时刻</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #D291BC;">阅读时光</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #FEC8D8;">猫咪互动</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #FFDFD3;">午后咖啡</div></div>
            <div class="grid-post"><div class="grid-post-cover" style="background: #FFFFD5;">健身打卡</div></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2023 趣聊 保留所有权利。</p>
            <div style="margin-top: 10px; font-size: 0.9rem;">
                <a href="index.html">首页</a> · <a href="register.html">注册</a>
            </div>
        </div>
    </footer>

</body>
</html>
