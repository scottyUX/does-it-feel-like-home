<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 定义都市女性的优雅</title>
    <style>
        :root {
            --primary-color: #4a4a4a;
            --accent-color: #b5a397;
            --bg-color: #fafafa;
            --white: #ffffff;
            --text-muted: #777;
            --border-color: #eee;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
        }

        header {
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
            text-decoration: none;
            color: var(--primary-color);
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            margin-left: 30px;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {
            height: 600px;
            background-color: #e8e4e1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('assets/image-8b1445a0fef0fd4d.jpg');
            background-size: cover;
            background-position: center;
            color: var(--white);
        }

        .hero-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero-content p {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn {
            background: var(--white);
            color: var(--primary-color);
            padding: 12px 35px;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .section {
            padding: 80px 0;
            text-align: center;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 50px;
            font-weight: 400;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 25%;
            width: 50%;
            height: 1px;
            background: var(--accent-color);
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .category-card {
            position: relative;
            overflow: hidden;
            height: 400px;
            background-color: #ddd;
            cursor: pointer;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .category-card:hover img {
            transform: scale(1.05);
        }

        .category-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            text-align: center;
            font-size: 18px;
            color: var(--primary-color);
        }

        footer {
            background: #f2f2f2;
            padding: 60px 0;
            border-top: 1px solid var(--border-color);
        }

        .footer-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
        }

        .footer-col h4 {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .footer-col ul {
            list-style: none;
            padding: 0;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        .footer-col ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .featured-grid { grid-template-columns: 1fr; }
            .footer-container { grid-template-columns: 1fr; }
            .container { flex-direction: column; gap: 20px; }
            nav a { margin: 0 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo">可衣 KEYI</a>
            <nav>
                <a href="index.html">首页</a>
                <a href="products.html">所有商品</a>
                <a href="cart.html">购物车</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>秋季系列：温婉都市</h1>
            <p>为独立女性打造的质感衣橱，兼顾职场专业与日常惬意。</p>
            <a href="products.html" class="btn">立即探索</a>
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">精心挑选</h2>
        <div class="featured-grid">
            <div class="category-card" onclick="location.href='products.html'">
                <img src="assets/image-28067df53791b711.jpg" alt="职场装">
                <div class="category-overlay">职场菁英系列</div>
            </div>
            <div class="category-card" onclick="location.href='products.html'">
                <img src="assets/image-713d90aeb36490e3.jpg" alt="日常装">
                <div class="category-overlay">惬意日常系列</div>
            </div>
            <div class="category-card" onclick="location.href='products.html'">
                <img src="assets/image-0b4f3328b6450a8c.jpg" alt="经典款">
                <div class="category-overlay">永恒经典系列</div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h4>关于可衣</h4>
                <p style="font-size: 14px; color: var(--text-muted);">坐标上海。我们致力于为20-40岁的现代女性提供高品质、简约且不过时的服装。</p>
            </div>
            <div class="footer-col">
                <h4>客户服务</h4>
                <ul>
                    <li><a href="#">配送政策</a></li>
                    <li><a href="#">退换货指南</a></li>
                    <li><a href="#">常见问题</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>快速链接</h4>
                <ul>
                    <li><a href="products.html">所有商品</a></li>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="cart.html">我的订单</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>联系我们</h4>
                <p style="font-size: 14px; color: var(--text-muted);">上海市静安区南京西路<br>邮箱: support@keyi-sh.com</p>
            </div>
        </div>
    </footer>

</body>
</html>
