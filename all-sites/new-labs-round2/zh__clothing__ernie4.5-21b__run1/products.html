<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 可衣</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 1.5rem;
        }
        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .section-title {
            text-align: center;
            margin: 2rem 0;
            font-size: 2rem;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 250px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-info {
            padding: 1.5rem;
        }
        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .product-price {
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .btn-primary {
            display: inline-block;
            background-color: #4ECDC4;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-btn {
            display: inline-block;
            background-color: #f5f7fa;
            color: #333;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 2rem 0;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">可衣</div>
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">商品列表</a></li>
                <li><a href="cart.html">购物车</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="section-title">商品列表</h1>
        
        <div class="products">
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">简约白衬衫</h3>
                    <p class="product-price">¥199</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">修身牛仔裤</h3>
                    <p class="product-price">¥259</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">通勤西装套装</h3>
                    <p class="product-price">¥399</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">休闲连衣裙</h3>
                    <p class="product-price">¥299</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">针织开衫</h3>
                    <p class="product-price">¥179</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/300x250" alt="商品图片">
                </div>
                <div class="product-info">
                    <h3 class="product-title">运动休闲裤</h3>
                    <p class="product-price">¥229</p>
                    <a href="product.html" class="btn-primary">查看详情</a>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 3rem;">
            <a href="index.html" class="back-btn">返回首页</a>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2023 可衣 - 上海网上女装店</p>
            <p>上海市徐汇区XX路XX号</p>
        </div>
    </footer>
</body>
</html>
