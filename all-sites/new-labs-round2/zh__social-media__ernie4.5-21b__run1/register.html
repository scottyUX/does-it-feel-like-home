<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 趣聊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #1da1f2;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 1.5rem;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .main-content {
            max-width: 500px;
            margin: 5rem auto;
            background-color: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .register-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .register-form {
            display: flex;
            flex-direction: column;
        }
        .register-form input {
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .register-form button {
            padding: 0.8rem;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .login-link a {
            color: #1da1f2;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">趣聊</div>
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="profile.html">个人主页</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="main-content">
        <h1 class="register-title">创建账号</h1>
        <form class="register-form">
            <input type="text" placeholder="用户名" required>
            <input type="email" placeholder="邮箱" required>
            <input type="password" placeholder="密码" required>
            <input type="password" placeholder="确认密码" required>
            <button type="submit">注册</button>
        </form>
        <div class="login-link">
            已有账号？<a href="index.html">立即登录</a>
        </div>
    </main>
    
    <footer>
        <p>© 2023 趣聊 版权所有</p>
    </footer>
</body>
</html>
