    <style>
        * {

        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background-color: #f8f8f8;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            width: 1440px;
            margin: 0 auto;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;

        ul {

        }
        ul li {
            margin-left: 1.5rem;

        a {

        a:hover {
            color: #ff6b6b;

        .hero {
            background-image: url('https://via.placeholder.com/1440x600');

            background-position: center;

            align-items: center;
            text-align: center;

            padding: 0 2rem;

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 1.5rem;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #ff5252;
        }
        section {
            padding: 4rem 2rem;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .services {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .service {
            width: 30%;
            background-color: #f9f9f9;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .service h3 {
            margin-bottom: 1rem;
            color: #ff6b6b;
        }
        .service p {
            margin-bottom: 1.5rem;
        }
        .price {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ff6b6b;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 2rem 0;

    <header>

                    <p class="price">¥280/4小时</p>
                </div>
                <div class="service">
                    <h3>开荒保洁</h3>

                    <p class="price">¥350/6小时</p>
                </div>
