<!DOCTYPE html>

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background-color: #f8f8f8;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            width: 1440px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .menu {
            display: flex;
            list-style: none;
        }
        .menu li {
            margin-left: 1.5rem;
        }
        .menu a {
            text-decoration: none;
            color: #333;
        }
        .section-title {
            font-size: 1.8rem;
            margin: 2rem 0 1.5rem;
        }
        .order-confirmation {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        .order-confirmation h2 {
            margin-bottom: 1rem;
        }
        .order-confirmation p {
            margin-bottom: 1.5rem;
        }
        .order-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .total {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f44336;
        }
        .btn-confirm {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn-back {
            display: inline-block;
            margin-top: 1rem;
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>

    <footer>

            <p>© 2023 快送外卖. 成都地区美食配送服务</p>

</html>
