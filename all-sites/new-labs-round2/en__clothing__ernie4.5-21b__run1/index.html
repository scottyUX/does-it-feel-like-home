<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 优雅衣橱</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>可衣 - 为现代女性打造精致衣橱</h1>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="products.html">产品列表</a></li>
                    <li><a href="cart.html">购物车</a></li>
                    <li><a href="about.html">关于我们</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>精选新品，时尚启程</h2>
            <p>为20-40岁女性提供高品质、时尚的日常与工作服装</p>
            <a href="products.html" class="btn">浏览新品</a>
        </section>

        <section class="featured-products">
            <h2>热门推荐</h2>
            <div class="products-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x400" alt="休闲连衣裙">
                    <h3>简约修身连衣裙</h3>
                    <p class="price">¥299</p>
                    <button class="btn">加入购物车</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x400" alt="通勤套装">
                    <h3>职业通勤套装</h3>
                    <p class="price">¥399</p>
                    <button class="btn">加入购物车</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x400" alt="针织开衫">
                    <h3>时尚针织开衫</h3>
                    <p class="price">¥199</p>
                    <button class="btn">加入购物车</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 可衣. 保留所有权利.</p>
            <p>上海市徐汇区时尚大道888号</p>
        </div>

    <script src="script.js"></script>

</html>
