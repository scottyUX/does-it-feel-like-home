<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学途 - 在线学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            width: 90%;
            max-width: 1440px;
            margin: 0 auto;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            list-style: none;
        }
        .nav-links li {
            margin-left: 1.5rem;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #3498db;
        }
        .hero {
            text-align: center;
            padding: 3rem 0;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .featured-courses {
            padding: 3rem 0;
        }
        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .course-card {
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .course-image {
            height: 200px;
            background-color: #eee;
        }
        .course-content {
            padding: 1.5rem;
        }
        .course-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .course-price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .course-description {
            margin-bottom: 1.5rem;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">学途</div>
                <ul class="nav-links">
                    <li><a href="index.html">首页</a></li>
                    <li><a href="courses.html">课程列表</a></li>
                    <li><a href="register.html">注册报名</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>开启你的学习之旅</h1>
            <p>为大学生和年轻职场人士提供优质的语言、计算机技能和考试备考课程。随时随地学习，提升自我。</p>
            <a href="courses.html" class="btn">浏览课程</a>
        </div>
    </section>

    <section class="featured-courses">
        <div class="container">
            <h2 class="section-title">热门课程</h2>
            <div class="courses-grid">
                <div class="course-card">
                    <div class="course-image"></div>
                    <div class="course-content">
                        <h3 class="course-title">英语进阶课程</h3>
                        <div class="course-price">¥1999/期</div>
                        <p class="course-description">适合有基础的学习者，提升听说读写能力，助力留学和职场发展。</p>
                        <a href="course-detail.html" class="btn">查看详情</a>
                    </div>
                </div>
                <div class="course-card">
                    <div class="course-image"></div>
                    <div class="course-content">
                        <h3 class="course-title">Python编程基础</h3>
                        <div class="course-price">¥1599/期</div>
                        <p class="course-description">从零开始学习Python编程，掌握数据处理、自动化脚本等实用技能。</p>
                        <a href="course-detail.html" class="btn">查看详情</a>
                    </div>
                </div>
                <div class="course-card">
                    <div class="course-image"></div>
                    <div class="course-content">
                        <h3 class="course-title">托福备考冲刺</h3>
                        <div class="course-price">¥2599/期</div>
                        <p class="course-description">针对托福考试设计，全面提升听、说、读、写能力，助你取得理想成绩。</p>
                        <a href="course-detail.html" class="btn">查看详情</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 学途在线学习平台. 保留所有权利.</p>
        </div>
    </footer>
</body>
</html>
