        <h2>工信部：今年将继续推动5G商用进程</h2>
        <p>2月22日，工信部召开新闻发布会，发布会上相关负责人表示，今年将继续推动5G商用进程。</p>
        <p>负责人强调，今年将加快推进5G网络建设，扩大5G商用范围。</p>
