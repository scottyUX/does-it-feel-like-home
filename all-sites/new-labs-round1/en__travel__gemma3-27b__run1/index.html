<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅行旅行 - 中国旅游预订</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #444;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
        }
        .search-container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .search-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .search-container input[type="text"],
        .search-container input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .search-container button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>畅行旅行</h1>
        <p>探索中国的美丽</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="results.html">搜索结果</a>
    </nav>

    <div class="search-container">
        <h2>目的地搜索</h2>
        <label for="destination">目的地:</label>
        <input type="text" id="destination" placeholder="输入目的地，例如：北京，上海">

        <label for="checkin">入住日期:</label>
        <input type="date" id="checkin">

        <label for="checkout">退房日期:</label>
        <input type="date" id="checkout">

        <button>搜索酒店</button>
    </div>

    <footer>
        &copy; 2024 畅行旅行. 版权所有.
    </footer>
</body>
</html>
