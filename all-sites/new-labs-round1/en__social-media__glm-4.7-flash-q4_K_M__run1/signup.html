<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - 趣聊</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-large {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .signup-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .signup-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .terms {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1.5rem;
            text-align: center;
            line-height: 1.5;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #f3f4f6;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="signup-header">
            <div class="logo-large">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                趣聊
            </div>
            <h2>创建账号</h2>
            <p>加入我们，分享生活，结交好友。</p>
        </div>

        <form>
            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" class="form-input" placeholder="设置一个独特的昵称" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">电子邮箱</label>
                <input type="email" id="email" class="form-input" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" class="form-input" placeholder="至少8位字符" required>
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">确认密码</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="再次输入密码" required>
            </div>

            <button type="button" class="btn-submit" onclick="alert('注册功能暂未开放，仅作为演示。')">立即注册</button>
        </form>

        <div class="divider">或通过社交账号注册</div>

        <div class="social-login">
            <button class="social-btn">
                <span style="font-size:1.2rem">📱</span> 微信
            </button>
            <button class="social-btn">
                <span style="font-size:1.2rem">🍎</span> Apple
            </button>
            <button class="social-btn">
                <span style="font-size:1.2rem">🔵</span> QQ
            </button>
            <button class="social-btn">
                <span style="font-size:1.2rem">🐧</span> 微博
            </button>
        </div>

        <div class="login-link">
            已有账号？ <a href="#">直接登录</a>
        </div>

        <div class="terms">
            注册即代表您同意<a href="#">用户服务协议</a>和<a href="#">隐私政策</a>。
        </div>
    </div>

</body>
</html>
