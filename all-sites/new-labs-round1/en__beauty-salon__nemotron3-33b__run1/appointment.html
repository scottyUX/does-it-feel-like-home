<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预约 - 悦容美发美容</title>
<style>
body {font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin:0; line-height:1.6; color:#333; background:#fafafa;}
.container {max-width:1200px; margin:0 auto; padding:20px;}
header {text-align:center; padding:20px 0;}
.logo {font-size:2.2em; margin-bottom:10px;}
nav ul {list-style:none; display:flex; justify-content:center; gap:30px; margin:0; padding:0;}
nav a {text-decoration:none; color:#0066cc; font-weight:500;}
nav a:hover {color:#ff6600;}
.hero {background:#f5f5f5; padding:60px 20px; text-align:center;}
.hero h2 {margin-top:0; color:#333;}
.hero p {font-size:1.1em; color:#555; margin-bottom:20px;}
.cta {display:inline-block; background:#ff6600; color:#fff; padding:12px 24px; text-decoration:none; border-radius:4px; font-weight:bold;}
.cta:hover {background:#e65c00;}
footer {text-align:center; padding:20px 0; font-size:0.9em; color:#777; margin-top:40px; border-top:1px solid #ddd;}
form {background:#fff; padding:20px; border:1px solid #ddd; border-radius:5px; max-width:600px; margin:0 auto;}
form div {margin-bottom:15px;}
form label {display:block; margin-bottom:5px; font-weight:500;}
form input, form select, form textarea {width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;}
form button {background:#ff6600; color:#fff; padding:10px 20px; border:none; border-radius:4px; cursor:pointer; font-size:1em;}
form button:hover {background:#e65c00;}
</style>
</head>
<body>
<header class="container">
<h1 class="logo">悦容美发美容</h1>
<nav>
<ul>
<li><a href="index.html">首页</a></li>
<li><a href="services.html">服务</a></li>
<li><a href="about.html">关于我们</a></li>
</ul>
</nav>
</header>

<div class="hero container">
<h2>在线预约</h2>
<p>请填写以下信息，我们将在24小时内与您联系确认预约。</p>

<form id="bookingForm">
<div>
<label for="name">姓名:</label><br>
<input type="text" id="name" name="name" required>
</div>
<div>
<label for="phone">手机号码:</label><br>
<input type="tel" id="phone" name="phone" required>
</div>
<div>
<label for="service">选择服务:</label><br>
<select id="service" name="service" required>
<option value="">-- 请选择 --</option>
<option value="理发">精致理发</option>
<option value="染发">染发 (单色)</option>
<option value="皮肤护理">皮肤护理 (面部)</option>
</select>
</div>
<div>
<label for="date">预约日期:</label><br>
<input type="date" id="date" name="date" required>
</div>
<div>
<label for="time">预约时间:</label><br>
<input type="time" id="time" name="time" required>
</div>
<div>
<label for="remark">备注 (可选):</label><br>
<textarea id="remark" name="remark" rows="3"></textarea>
</div>
<div style="text-align:center;">
<button type="submit">提交预约</button>
</div>
</form>

<script>
document.getElementById('bookingForm').addEventListener('submit', function(e) {
e.preventDefault();
alert('感谢您的预约，我们将在24小时内与您联系！');
});
</script>
</div>

<footer>
版权所有 2025 悦容美发美容 · 广州市天河区体验路 18 号 · 电话 020-12345678
</footer>
</body>
</html>
