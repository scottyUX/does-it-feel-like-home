<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>餐厅列表 - 快送外卖</title>
<style>
    body{font-family:Arial,sans-serif;margin:0;padding:0;color:#333;background:#f9f9f9;}
    .container{max-width:1200px;margin:0 auto;padding:20px;}
    header{background:#004d40;color:#fff;padding:15px 0;text-align:center;position:sticky;top:0;z-index:10;}
    nav a{color:#fff;text-decoration:none;margin:0 15px;font-weight:bold;}
    .list{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;}
    .restaurant-card{background:#fff;border:1px solid #ddd;border-radius:8px;width:260px;padding:15px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    .restaurant-card img{width:100%;height:150px;object-fit:cover;margin-bottom:10px;}
    .restaurant-card h3{margin:10px 0;font-size:1.2em;}
    .restaurant-card p{font-size:0.9em;color:#666;margin-bottom:10px;}
    .restaurant-card a{background:#28a745;color:#fff;padding:8px 12px;border-radius:4px;text-decoration:none;display:inline-block;}
    footer{background:#222;color:#ccc;text-align:center;padding:15px 0;margin-top:40px;}
    @media (max-width:768px){
        .container{padding:10px;}
    }
</style>
</head>
<body>
<div class="container">
<header>
    <h1>餐厅列表</h1>
    <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="order_confirm.html">订单确认</a>
    </nav>
</header>

<section class="list">
    <div class="restaurant-card">
        <img src="assets/image-e7cf961a932b170b.png" alt="味满园">
        <h3>味满园</h3>
        <p>四川经典小吃，香辣鲜香</p>
        <p>人均：30-80元</p>
        <a href="restaurant.html">查看菜单</a>
    </div>
    <div class="restaurant-card">
        <img src="assets/image-317f314380d73ce3.png" alt="北极星披萨">
        <h3>北极星披萨</h3>
        <p>手工薄底披萨，多种配料</p>
        <p>人均：50-120元</p>
        <a href="restaurant.html">查看菜单</a>
    </div>
    <div class="restaurant-card">
        <img src="assets/image-b71cc06c0d76d439.png" alt="甜品屋">
        <h3>甜品屋</h3>
        <p>精致蛋糕与手作甜点</p>
        <p>人均：20-60元</p>
        <a href="restaurant.html">查看菜单</a>
    </div>
</section>

<footer>
    <p>© 2025 快送外卖 · 成都配送服务</p>
    <p>联系电话：138-0011-2233</p>
</footer>
</div>
</body>
</html>
