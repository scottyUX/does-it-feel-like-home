<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趣聊 - 帖子详情</title>
<style>
body{margin:0;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;background:#f5f5f5;}
header{background:#ffffff;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:1.8rem;color:#ff5e00;font-weight:bold;}
nav a{margin-left:20px;color:#333;text-decoration:none;font-size:1rem;}
nav a:hover{color:#ff5e00;}
.container{max-width:1000px;margin:20px auto;}
.post{background:#ffffff;padding:20px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.post-header{display:flex;align-items:center;margin-bottom:10px;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:10px;}
.post-user{font-weight:bold;color:#333;}
.post-time{font-size:.85rem;color:#999;margin-left:10px;}
.post-content{margin-bottom:10px;font-size:1rem;color:#333;}
.post-img{width:100%;height:auto;border-radius:5px;margin-bottom:10px;}
.actions{display:flex;gap:20px;margin-bottom:20px;}
button{background:none;border:none;color:#ff5e00;font-size:1rem;cursor:pointer;}
button:focus{outline:none;}
.comment-section{background:#ffffff;padding:15px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.comment{margin-bottom:10px;}
.comment-user{font-weight:bold;color:#333;}
.comment-time{font-size:.85rem;color:#999;margin-left:10px;}
.comment-text{margin-top:5px;font-size:1rem;color:#333;}
.comment-form textarea{width:100%;height:80px;border:1px solid #ccc;border-radius:5px;padding:8px;font-size:1rem;}
.comment-form button{margin-top:10px;background:#ff5e00;color:#fff;border:none;padding:8px 16px;border-radius:5px;cursor:pointer;}
footer{background:#ffffff;padding:20px;text-align:center;color:#999;font-size:.9rem;margin-top:40px;}
</style>
</head>
<body>
<header>
<div class="logo">趣聊</div>
<nav>
<a href="index.html">首页</a>
<a href="profile.html">个人主页</a>
<a href="post.html">发布</a>
<a href="signup.html">注册</a>
</nav>
</header>
<div class="container">
<div class="post">
<div class="post-header">
<img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmaWxsPSIjZGRkZGRkIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iNDAiLz48L3N2Zz4=" alt="头像" class="avatar">
<div><span class="post-user">小李</span><span class="post-time">1天前</span></div>
</div>
<div class="post-content">今天去了山顶，看到了壮观的日出，心情愉悦。</div>
<img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjgwIiB2aWV3Qm94PSIwIDAgMTAwIDgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9IiNlZWVmZiI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSI4MCIvPjwvc3ZnPg==" alt="帖子图片" class="post-img">
<div class="actions">
<button>赞</button>
<button>评论</button>
</div>
</div>

<div class="comment-section">
<h3>评论 (3)</h3>
<div class="comment">
<span class="comment-user">美菜菜</span><span class="comment-time">2小时前</span>
<div class="comment-text">太美了，真的想去看看！</div>
</div>
<div class="comment">
<span class="comment-user">风云少年</span><span class="comment-time">1.5小时前</span>
<div class="comment-text">日出时分的光影真是无与伦比。</div>
</div>
<div class="comment">
<span class="comment-user">小星星</span><span class="comment-time">1小时前</span>
<div class="comment-text">我也想去，你们能告诉我是哪座山吗？</div>
</div>

<form class="comment-form">
<textarea placeholder="写下你的评论..."></textarea>
<button>发布</button>
</form>
</div>
</div>
<footer>© 2024 趣聊 版权所有</footer>

});
</script>
</body>
</html>
