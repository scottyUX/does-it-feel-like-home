  <h1>关于我们</h1>
  <div class="story">
    <p>家味餐厅自1998年创立以来，一直秉持“以家常菜为基调，传承浙江传统味道”的理念。餐厅位于杭州西湖边的老城区，环境温馨，服务热情。</p>
    <p>创始人张明先生曾在杭州本地名厨学校深造，多年的家庭烹饪经验与现代烹饪技术相结合，力求将最纯正的杭州本地风味呈现给每一位顾客。</p>
    <p>我们使用当地新鲜食材，配合传统酱料，力求让每一道菜都保留原汁原味。无论是家庭聚餐、商务午餐还是游客随餐，家味餐厅都能为您提供温馨、舒适的用餐体验。</p>
