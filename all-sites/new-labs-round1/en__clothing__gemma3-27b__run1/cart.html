<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可衣 - 购物车</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f8f8f8;
    color: #333;
}

header {
    background-color: #fff;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

nav {
    background-color: #eee;
    padding: 10px;
    text-align: center;
}

nav a {
    color: #333;
    text-decoration: none;
    padding: 10px 20px;
    display: inline-block;
}

nav a:hover {
    background-color: #ddd;
}

main {
    padding: 20px;
}

.cart-table {
    width: 100%;
    border-collapse: collapse;
}

.cart-table th, .cart-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

.cart-table th {
    background-color: #f2f2f2;
}

.cart-table .quantity input {
    width: 60px;
    text-align: center;
}

.total {
    text-align: right;
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

button {
    background-color: #e4393c;
    color: #fff;
    border: none;
    padding: 12px 25px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
    margin-top: 20px;
}

footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px;
    margin-top: 30px;
}
</style>
</head>
<body>
    <header>
        <h1>可衣</h1>
        <p>上海领先的时尚女装在线商店</p>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="products.html">产品列表</a>
        <a href="cart.html">购物车</a>
        <a href="about.html">关于我们</a>
    </nav>
    <main>
        <h2>您的购物车</h2>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>商品</th>
                    <th>数量</th>
                    <th>单价</th>
                    <th>总价</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>夏季印花连衣裙</td>
                    <td class="quantity"><input type="number" value="1"></td>
                    <td>¥329</td>
                    <td>¥329</td>
                </tr>
                <tr>
                    <td>高腰修身牛仔裤</td>
                    <td class="quantity"><input type="number" value="2"></td>
                    <td>¥259</td>
                    <td>¥518</td>
                </tr>
            </tbody>
        </table>
        <div class="total">
            总计: ¥847
        </div>
        <button>结算</button>
    </main>
    <footer>
        &copy; 2024 可衣 - 版权所有
    </footer>
</body>
</html>
