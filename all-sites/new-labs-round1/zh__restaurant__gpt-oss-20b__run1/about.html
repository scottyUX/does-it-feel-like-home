<h1>关于我们</h1>
<p>家味餐厅创立于2010年，始于一位热爱传统浙江菜的厨师与其家族。我们坚持使用本地新鲜食材，结合家传烹饪技艺，力求让每一道菜都能让客人感受到“家”的温暖。</p>
<p>餐厅位于杭州市西湖区翠苑路，环境优雅，座位宽敞，既适合家庭聚餐，也适合商务洽谈。我们的目标是为每一位客人提供舒适的就餐体验与贴心的服务。</p>
<p>在这里，您可以品尝到经典的东坡肉、叫化鸡等正宗浙江菜，也可以尝试我们的特色甜点和手工小吃。无论是日常聚餐还是特别场合，家味餐厅都愿意成为您的首选。</p>
