<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>畅行旅行 - 搜索结果</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
        .header{background:#fff;padding:20px 0;border-bottom:1px solid #e0e0e0;}
        .header .logo{font-size:28px;font-weight:bold;color:#ff5a5f;text-align:center;}
        .nav{display:flex;justify-content:center;margin-top:10px;}
        .nav a{margin:0 15px;color:#333;text-decoration:none;}
        .nav a:hover{color:#ff5a5f;}
        .container{max-width:1440px;margin:auto;padding:20px;}
        .hotel-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
        .hotel-card{background:#fff;padding:15px;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        .hotel-card img{width:100%;height:160px;object-fit:cover;border-radius:5px;}
        .hotel-card h3{margin:10px 0 5px;}
        .hotel-card p{margin:5px 0;color:#777;}
        .hotel-card a{display:inline-block;margin-top:10px;color:#ff5a5f;text-decoration:none;}
        .hotel-card a:hover{color:#e04e4e;}
        footer{background:#fff;text-align:center;padding:15px;margin-top:30px;border-top:1px solid #e0e0e0;font-size:14px;color:#777;}
        @media (max-width:600px){
            .nav{flex-direction:column;}
            .nav a{margin:5px 0;}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">畅行旅行</div>
        <nav class="nav">
            <a href="index.html">首页</a>
            <a href="search.html">搜索结果</a>
            <a href="booking.html">预订中心</a>
        </nav>
    </header>
    <main class="container">
        <section>
            <h2>搜索结果</h2>
            <div class="hotel-list">
                <div class="hotel-card">
                    <img src="hotel1.jpg" alt="湖景假日酒店">
                    <h3>湖景假日酒店</h3>
                    <p>星级：★★★★</p>
                    <p>价格：¥650/晚</p>
                    <a href="hotel.html?id=1">查看详情</a>
                </div>
                <div class="hotel-card">
                    <img src="hotel2.jpg" alt="山景度假村">
                    <h3>山景度假村</h3>
                    <p>星级：★★★★★</p>
                    <p>价格：¥980/晚</p>
                    <a href="hotel.html?id=2">查看详情</a>
                </div>
                <div class="hotel-card">
                    <img src="hotel3.jpg" alt="海滩豪庭">
                    <h3>海滩豪庭</h3>
                    <p>星级：★★★★</p>
                    <p>价格：¥750/晚</p>
                    <a href="hotel.html?id=3">查看详情</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        © 2026 畅行旅行 - 旅游预订服务
    </footer>
</body>
</html>
