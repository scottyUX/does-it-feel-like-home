<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修身西装外套 - 可衣</title>
    <style>
        body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f9f9f9;color:#333;}
        header{background:#fff;padding:20px 40px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;}
        header h1{font-size:24px;}
        nav a{margin:0 15px;text-decoration:none;color:#333;font-weight:500;}
        main{max-width:1200px;margin:0 auto;padding:40px 20px;display:flex;flex-wrap:wrap;gap:40px;}
        .image{flex:1 1 300px;}
        .image img{max-width:100%;height:auto;border-radius:4px;}
        .info{flex:1 1 300px;}
        .info h2{font-size:28px;margin-bottom:10px;}
        .info p{font-size:16px;margin-bottom:15px;}
        .price{font-size:22px;color:#ff4081;margin-bottom:20px;}
        .size{margin-bottom:15px;}
        .qty{margin-bottom:15px;}
        button{padding:10px 20px;background:#ff4081;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;}
        footer{background:#fff;padding:20px;text-align:center;border-top:1px solid #ddd;margin-top:40px;}
        @media(max-width:768px){
            main{flex-direction:column;}
        }
    </style>
</head>
<body>
<header>
    <h1>可衣</h1>
    <nav>
        <a href="index.html">首页</a>
        <a href="product-list.html">商品</a>
        <a href="cart.html">购物车</a>
    </nav>
</header>
<main>
    <div class="image">
        <img src="images/blazer.jpg" alt="修身西装外套">
    </div>
    <div class="info">
        <h2>修身西装外套</h2>
        <p>专业剪裁的修身西装外套，凸显干练气质，适合商务与正式场合。</p>
        <div class="price">￥399</div>
        <div class="size">
            <label for="sizeSelect">尺码：</label>
            <select id="sizeSelect">
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
            </select>
        </div>
        <div class="qty">
            <label for="qtyInput">数量：</label>
            <input type="number" id="qtyInput" value="1" min="1" style="width:60px;">
        </div>
        <button id="addToCart">加入购物车</button>
    </div>
</main>
<footer>
    © 2026 可衣. 版权所有
</footer>
<script>
    function addToCart() {
        const product = {
            id: 'product2',
            name: '修身西装外套',
            size: document.getElementById('sizeSelect').value,
            price: 399,
            qty: parseInt(document.getElementById('qtyInput').value, 10)
        };
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const index = cart.findIndex(item => item.id === product.id && item.size === product.size);
        if (index > -1) {
            cart[index].qty += product.qty;
        } else {
            cart.push(product);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('已加入购物车');
    }
    document.getElementById('addToCart').addEventListener('click', addToCart);
</script>
</body>
</html>
