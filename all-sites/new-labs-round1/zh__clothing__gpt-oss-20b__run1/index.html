<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 上海女装店</title>
    <style>
        body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f9f9f9;color:#333;}
        header{background:#fff;padding:20px 40px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;}
        header h1{font-size:24px;}
        nav a{margin:0 15px;text-decoration:none;color:#333;font-weight:500;}
        main{max-width:1200px;margin:0 auto;padding:40px 20px;}
        .hero{background:#f0f8ff;padding:80px 20px;text-align:center;}
        .hero h2{font-size:36px;margin-bottom:20px;}
        .hero p{font-size:18px;color:#555;}
        .featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:40px;}
        .card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:4px;text-align:center;}
        .card img{max-width:100%;height:auto;border-radius:4px;}
        .card h3{font-size:20px;margin:15px 0 10px;}
        .card p{color:#777;margin-bottom:10px;}
        .card a{display:inline-block;padding:10px 20px;background:#ff4081;color:#fff;border-radius:4px;text-decoration:none;font-weight:500;}
        footer{background:#fff;padding:20px;text-align:center;border-top:1px solid #ddd;margin-top:40px;}
        @media(max-width:600px){
            header{flex-direction:column;align-items:flex-start;}
            nav{margin-top:10px;}
        }
    </style>
</head>
<body>
<header>
    <h1>可衣</h1>
    <nav>
        <a href="product-list.html">商品</a>
        <a href="cart.html">购物车</a>
    </nav>
</header>
<main>
    <section class="hero">
        <h2>时尚从这里开始</h2>
        <p>上海本土原创设计，专为职场与日常穿搭打造的高品质女装。</p>
    </section>
    <section class="featured">
        <article class="card">
            <img src="images/blouse.jpg" alt="简约衬衫">
            <h3>简约衬衫</h3>
            <p>￥199</p>
            <a href="product1.html">查看详情</a>
        </article>
        <article class="card">
            <img src="images/blazer.jpg" alt="修身西装外套">
            <h3>修身西装外套</h3>
            <p>￥399</p>
            <a href="product2.html">查看详情</a>
        </article>
        <article class="card">
            <img src="images/sweater.jpg" alt="针织衫">
            <h3>针织衫</h3>
            <p>￥149</p>
            <a href="product3.html">查看详情</a>
        </article>
        <article class="card">
            <img src="images/dress.jpg" alt="连衣裙">
            <h3>连衣裙</h3>
            <p>￥279</p>
            <a href="product4.html">查看详情</a>
        </article>
    </section>
</main>
<footer>
    © 2026 可衣. 版权所有
</footer>
</body>
</html>
