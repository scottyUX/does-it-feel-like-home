<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可衣 - 女士时尚服饰</title>
<style>
  body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
  .header { background: #f4f4f4; padding: 10px 0; }
  .header-container { width: 1440px; margin: 0 auto; }
  .logo { float: left; font-size: 24px; color: #333; }
  .nav { float: right; }
  .nav a { text-decoration: none; color: #333; padding: 0 20px; }
  .nav a:hover { color: #0066cc; }
  .hero { background: url('hero-background.jpg') no-repeat center center; background-size: cover; height: 600px; }
  .hero-content { padding: 200px 0; text-align: center; }
  .hero-content h1 { color: white; font-size: 36px; }
  .products { padding: 40px; }
  .product { float: left; width: 30%; margin-bottom: 30px; }
  .product img { width: 100%; }
  .product-info { margin-top: 10px; }
  .product-name { font-size: 20px; }
  .product-price { color: #f00; }
  .footer { background: #333; color: white; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-container">
      <div class="logo">可衣</div>
      <div class="nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="products.html">产品列表</a>
        <a href="cart.html">购物车</a>
      </div>
    </div>
  </div>
  <div class="hero">
    <div class="hero-content">
      <h1>时尚服饰，只为更美的你</h1>
    </div>
  </div>
  <div class="products">
    <div class="product">
      <img src="tops.jpg" alt="上衣">
      <div class="product-info">
        <h3 class="product-name">优雅上衣</h3>
        <p class="product-price">¥ 299</p>
      </div>
    </div>
    <div class="product">
      <img src="skirts.jpg" alt="裙子">
      <div class="product-info">
        <h3 class="product-name">时尚裙子</h3>
        <p class="product-price">¥ 399</p>
      </div>
    </div>
    <div class="product">
      <img src="dresses.jpg" alt="连衣裙">
      <div class="product-info">
        <h3 class="product-name">优雅连衣裙</h3>
        <p class="product-price">¥ 499</p>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>版权所有 &copy; 可衣</p>
  </div>
</body>
</html>
