<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>洁家家政 - 预约保洁</title>
<style>
body{margin:0;font-family:"Helvetica Neue","Arial","宋体";color:#333;background:#f5f5f5;}
header{background:#4a90e2;color:white;padding:15px 0;}
nav{max-width:1200px;margin:auto;display:flex;justify-content:center;}
nav a{color:white;text-decoration:none;margin:0 15px;position:relative;padding-bottom:5px;}
nav a::after{content:"";position:absolute;bottom:0;left:0;width:0;height:2px;background:white;transition:width .3s;}
nav a:hover::after{width:100%;}
section{max-width:1200px;margin:40px auto;padding:0 20px;}
form{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
label{display:block;margin-top:10px;}
input,textarea{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:4px;}
button{margin-top:15px;padding:10px 20px;background:#4a90e2;color:white;border:none;border-radius:4px;cursor:pointer;}
button:hover{background:#357abd;}
footer{background:#333;color:white;text-align:center;padding:15px 0;margin-top:40px;}
@media(max-width:768px){nav{flex-direction:column;}}
</style>
<script>
function showAlert(e){e.preventDefault();alert("感谢您的预约，客服将尽快与您联系。");}
</script>
</head>
<body>
<header>
<nav>
<a href="index.html">首页</a>
<a href="services.html">服务</a>
<a href="about.html">关于</a>
<a href="appointment.html">预约</a>
</nav>
</header>
<section>
<h2>预约保洁</h2>
<form onsubmit="showAlert(event)">
<label>姓名：
<input type="text" name="name" required>
</label>
<label>联系电话：
<input type="tel" name="phone" required>
</label>
<label>地址：
<input type="text" name="address" required>
</label>
<label>首选日期：
<input type="date" name="date" required>
</label>
<label>保洁套餐：
<select name="package" required>
<option value="基础">基础保洁套餐</option>
<option value="标准">标准保洁套餐</option>
<option value="豪华">豪华保洁套餐</option>
</select>
</label>
<label>其他需求：
<textarea name="message" rows="4"></textarea>
</label>
<button type="submit">提交预约</button>
</form>
</section>
<footer>
<p>洁家家政 © 2024 北京市</p>
</footer>
</body>
</html>
