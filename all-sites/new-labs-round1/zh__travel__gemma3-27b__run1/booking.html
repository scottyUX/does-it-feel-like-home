<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅行旅行 - 预订</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: #3498db;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #f4f4f4;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .booking-container {
            padding: 20px;
        }

        .booking-form {
            width: 50%;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }

        .booking-form label {
            display: block;
            margin-bottom: 5px;
        }

        .booking-form input[type="text"],
        .booking-form input[type="email"],
        .booking-form input[type="tel"] {
            padding: 10px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .booking-form button {
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>畅行旅行</h1>
        <p>探索中国，享受旅程</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="results.html">搜索结果</a>
        <a href="details.html">酒店详情</a>
        <a href="booking.html">预订</a>
    </nav>

    <div class="booking-container">
        <h2>预订信息</h2>

        <form class="booking-form">
            <label for="name">姓名：</label>
            <input type="text" id="name" placeholder="您的姓名">

            <label for="email">邮箱：</label>
            <input type="email" id="email" placeholder="您的邮箱">

            <label for="phone">电话：</label>
            <input type="tel" id="phone" placeholder="您的电话">

            <label for="guests">入住人数：</label>
            <input type="text" id="guests" placeholder="几位客人">

            <button>提交预订</button>
        </form>
    </div>

    <footer>
        &copy; 2024 畅行旅行 - 版权所有
    </footer>

</body>
</html>
