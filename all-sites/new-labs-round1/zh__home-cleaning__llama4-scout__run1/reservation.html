<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洁家家政 - 预约服务</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        nav {
            background-color: #444;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
        }
        .reservation {
            padding: 20px;
        }
        .reservation h3 {
            font-size: 24px;
            margin: 10px 0;
        }
        form {
            padding: 20px;
        }
        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        form button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <header>
        <h1>洁家家政</h1>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="service.html">服务项目</a>
        <a href="about.html">关于我们</a>
        <a href="reservation.html">预约服务</a>
    </nav>
    <div class="container">
        <div class="reservation">
            <h3>预约服务</h3>
            <form>
                <input type="text" placeholder="姓名">
                <input type="tel" placeholder="电话号码">
                <textarea placeholder="地址"></textarea>
                <input type="date" placeholder="预约日期">
                <input type="time" placeholder="预约时间">
                <button>提交预约</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 洁家家政</p>
    </footer>
</body>
</html>
