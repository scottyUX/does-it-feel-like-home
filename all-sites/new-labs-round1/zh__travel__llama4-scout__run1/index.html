<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅行旅行</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .search-form input, .search-form select {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        .search-form button {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>畅行旅行</h1>
    </div>
    <div class="container">
        <div class="search-form">
            <form>
                <input type="text" placeholder="目的地">
                <select>
                    <option value="">请选择日期</option>
                    <option value="1">1天</option>
                    <option value="2">2天</option>
                    <option value="3">3天</option>
                </select>
                <button>搜索</button>
            </form>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2023 畅行旅行</p>
    </div>
</body>
</html>
