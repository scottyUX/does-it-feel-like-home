<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>家味餐厅 - 预订座位</title>
    <style>
        body{font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;margin:0;color:#333;background:#f9f9f9;}
        .container{max-width:1200px;margin:auto;padding:20px;}
        header{text-align:center;padding:20px 0;background:#fff;border-bottom:1px solid #e0e0e0;}
        header h1{margin:0;font-size:2.2em;color:#d32f2f;}
        nav{margin-top:10px;}
        nav a{margin:0 15px;text-decoration:none;color:#d32f2f;font-weight:bold;}
        .section{margin:40px 0;background:#fff;padding:20px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        form{display:flex;flex-direction:column;max-width:600px;margin:auto;}
        label{margin-top:15px;font-weight:bold;}
        input, textarea{padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:4px;}
        .btn{margin-top:20px;padding:12px 20px;background:#d32f2f;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1em;}
        .error{color:#d32f2f;font-size:0.9em;margin-top:5px;}
        footer{text-align:center;padding:20px 0;background:#fff;border-top:1px solid #e0e0e0;color:#666;font-size:0.9em;}
        @media (max-width:768px){
            .section{padding:15px;}
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>家味餐厅 - 预订座位</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="about.html">关于我们</a>
            <a href="menu.html">菜单</a>
        </nav>
    </header>

    <div class="section">
        <h2>请填写以下信息进行预订</h2>
        <form id="reservationForm" action="#" method="post" onsubmit="return false;">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">电话</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}" placeholder="请输入11位手机号">

            <label for="date">日期</label>
            <input type="date" id="date" name="date" required>

            <label for="time">时间</label>
            <input type="time" id="time" name="time" required>

            <label for="party">人数</label>
            <input type="number" id="party" name="party" min="1" max="20" required>

            <label for="note">备注（可选）</label>
            <textarea id="note" name="note" rows="3" placeholder="特殊需求或留言"></textarea>

            <div class="error" id="errorMsg"></div>

            <button type="submit" class="btn">提交预订</button>
        </form>
    </div>

    <footer>
        © 2025 家味餐厅 · 版权所有
    </footer>
</div>

<script>
    // 简单的前端表单校验示例
    document.getElementById('reservationForm').addEventListener('submit', function(e){
        e.preventDefault(); // 防止实际提交
        const phone = document.getElementById('phone').value;
        const phonePattern = /^[0-9]{11}$/;
        const errorMsg = document.getElementById('errorMsg');
        if (!phonePattern.test(phone)) {
            errorMsg.textContent = '请输入有效的11位手机号';
            return;
        }
        alert('预订表单已收到，我们将在1小时内与您联系确认。');
    });
</script>
</body>
</html>
