        <p>我们的招牌菜包括西湖醋鱼、龙井虾仁、绍兴醉鸡以及多款季节性小菜，价格亲民，份量十足。无论是家庭聚餐、商务午餐还是旅游观光，家味餐厅都是您的不二选择。</p>
