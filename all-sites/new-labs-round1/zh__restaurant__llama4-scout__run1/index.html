        <h2>欢迎来到家味餐厅</h2>
        <p>家味餐厅是一家位于杭州的家庭餐厅，我们专注于提供正宗的浙江菜。我们的餐厅以温馨的氛围和美味的菜肴吸引了许多本地家庭和上班族。</p>
        <p>我们提供各种各样的菜肴，包括西湖醋鱼、东坡肉、宁波汤圆等。我们的厨师团队致力于使用新鲜的食材和传统的烹饪方法，为您带来最好的用餐体验。</p>
