<h1>中国教育改革新政公布，重塑中小学课程体系</h1>
<p>2026年10月12日，中国教育部正式公布2026-2028年教育改革新政策。新政策将进一步完善课程体系，强化基础教育质量，提升学生综合素养。</p>
<p>主要内容包括：减少填鸭式考试，增设创新思维课程；加强师资培训，提升教师专业能力；鼓励学校使用数字化教学资源，实现线上线下混合教学。</p>
<p>教育专家认为，此举将有助于缓解学生学业压力，提高学习兴趣。家长和学校普遍对此表示支持，期待改革落地后带来教育质量的提升。</p>
<p>未来三年，教育部门将对各地区实施分阶段评估，确保改革措施有效落地。</p>
