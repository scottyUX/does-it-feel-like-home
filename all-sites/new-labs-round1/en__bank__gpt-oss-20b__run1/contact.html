<!DOCTYPE html>
<html lang="zh-CN">

ul{list-style:none;padding:0;}
ul li{margin-bottom:10px;}

label{display:block;margin-bottom:5px;font-weight:bold;}
input,textarea{width:100%;padding:8px;margin-bottom:15px;border:1px solid #ddd;border-radius:4px;}
button{background:#004a99;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;}
button:hover{background:#003366;}
footer{background:#004a99;color:#fff;text-align:center;padding:15px 0;}

<input type="tel" id="phone" name="phone" placeholder="请输入电话">
