<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悦容美发美容 - 预约</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="悦容美发美容" width="150">
    </div>
    <div class="nav">
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="services.html">服务</a></li>
            <li><a href="team.html">团队介绍</a></li>
            <li><a href="appointment.html">预约</a></li>
        </ul>
    </div>
    <div class="appointment">
        <h2>预约服务</h2>
        <form>
            <label for="name">姓名:</label>
            <input type="text" id="name" name="name" required><br>
            <label for="phone">电话:</label>
            <input type="tel" id="phone" name="phone" required><br>
            <label for="service">服务:</label>
            <select id="service" name="service" required>
                <option value="">请选择服务</option>
                <option value=" haircut">专业剪发</option>
                <option value=" coloring">时尚染发</option>
                <option value=" beauty">美容护理</option>
                <option value=" scalp">头皮护理</option>
            </select><br>
            <label for="date">预约日期:</label>
            <input type="date" id="date" name="date" required><br>
            <label for="time">预约时间:</label>
            <input type="time" id="time" name="time" required><br>
            <input type="submit" value="提交预约">
        </form>
    </div>
    <div class="footer">
        <p>悦容美发美容 &copy; 2023</p>
    </div>
</body>
</html>
