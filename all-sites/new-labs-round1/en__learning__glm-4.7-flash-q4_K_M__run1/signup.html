<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - 学途</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1e40af;
            --secondary-color: #0f172a;
            --bg-light: #f8fafc;
            --text-main: #334155;
            --text-light: #64748b;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --radius-md: 8px;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background-color: var(--bg-light); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; transition: color 0.2s; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 32px; }
        .nav-links a { font-weight: 500; color: var(--text-main); }
        .nav-links a:hover { color: var(--primary-color); }

        /* Signup Page Layout */
        .auth-container {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header h1 { font-size: 1.75rem; color: var(--secondary-color); margin-bottom: 8px; }
        .auth-header p { color: var(--text-light); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main); font-size: 0.95rem; }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .role-select {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }
        .radio-label:hover { background-color: var(--bg-light); }
        input[type="radio"] { accent-color: var(--primary-color); }
        
        .checkbox-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .checkbox-group input { width: auto; }
        .checkbox-group label { color: var(--text-light); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-dark); }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .auth-footer a { color: var(--primary-color); font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-divider::before { margin-right: 10px; }
        .auth-divider::after { margin-left: 10px; }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-social:hover { background-color: var(--bg-light); }

        .footer-simple { background: var(--white); padding: 20px; text-align: center; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-light); }

        @media (max-width: 480px) {
            .auth-card { padding: 30px 20px; }
            .role-select { flex-direction: column; gap: 8px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrapper">
        <a href="index.html" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10v6"/><path d="M20 16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2-2z"/><path d="M6 12h.01M18 12h.01"/><path d="M4 4h16v2H4z"/></svg>
            学途
        </a>
        <nav class="nav-links">
            <a href="index.html">首页</a>
            <a href="courses.html">课程</a>
            <a href="#">机构合作</a>
        </nav>
        <div class="nav-actions">
            <a href="signup.html" style="font-weight: 600; color: var(--primary-color);">已有账号？登录</a>
        </div>
    </div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>创建新账号</h1>
            <p>加入学途，开启你的学习之旅</p>
        </div>

        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">注册身份</label>
                <div class="role-select">
                    <label class="radio-label">
                        <input type="radio" name="role" value="student" checked>
                        学员
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="role" value="teacher">
                        讲师
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" class="form-input" placeholder="设置您的用户名" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">电子邮箱</label>
                <input type="email" id="email" class="form-input" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">设置密码</label>
                <input type="password" id="password" class="form-input" placeholder="6位以上字符" required>
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">确认密码</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="再次输入密码" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">我已阅读并同意 <a href="#" style="color: var(--primary-color);">用户服务协议</a> 和 <a href="#" style="color: var(--primary-color);">隐私政策</a></label>
            </div>

            <button type="button" class="btn-submit" onclick="alert('注册演示：表单提交成功！')">立即注册</button>
        </form>

        <div class="auth-divider">或通过以下方式注册</div>

        <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
            注册微信账号
        </button>
        <button class="btn-social" style="margin-top: 10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
            注册支付宝账号
        </button>

        <div class="auth-footer">
            已有账号？ <a href="signup.html">直接登录</a>
        </div>
    </div>
</div>

<div class="footer-simple">
    &copy; 2023 学途在线教育科技有限公司 版权所有
</div>

</body>
</html>
