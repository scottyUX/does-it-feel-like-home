<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单已提交 - 快送外卖</title>
    <style>
        :root {
            --primary-color: #ff4400;
            --text-dark: #333333;
            --text-gray: #666666;
            --bg-light: #f4f4f4;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

        body { background-color: var(--bg-light); color: var(--text-dark); min-height: 80vh; display: flex; flex-direction: column; }

        .header { background: var(--white); padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; flex: 1; text-align: center; }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #f6ffed;
            color: #52c41a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            border: 2px solid #b7eb8f;
        }

        h1 { font-size: 28px; margin-bottom: 15px; color: #333; }

        .order-id { color: var(--text-gray); margin-bottom: 30px; }

        .info-card {
            background: var(--white);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .info-row span:first-child { color: var(--text-gray); }
        .info-row span:last-child { font-weight: bold; }

        .btn-home {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 20px;">⚡ 快送外卖</div>
    </div>

    <div class="container">
        <div class="success-icon">✓</div>
        <h1>订单提交成功！</h1>
        <div class="order-id">订单号：KSW20231024001</div>
        
        <div class="info-card">
            <div class="info-row">
                <span>收货人</span>
                <span>张先生</span>
            </div>
            <div class="info-row">
                <span>手机号</span>
                <span>138****1234</span>
            </div>
            <div class="info-row">
                <span>订单金额</span>
                <span>¥46.00</span>
            </div>
            <div class="info-row">
                <span>预计送达</span>
                <span>30分钟内</span>
            </div>
        </div>

        <button class="btn-home" onclick="window.location.href='index.html'">回到首页</button>
    </div>

</body>
</html>
