<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单 - 家味餐厅</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;

            margin: 0;

        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .menu {
            width: 80%;
            margin: 0 auto;
        }
        .menu h2 {
            margin-top: 0;
        }
        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .menu li {
            margin-bottom: 10px;
        }
        .menu .name {
            font-weight: bold;

<body>
    <div class="header">
        <h1>家味餐厅</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>

    <div class="main">
        <div class="menu">
            <h2>菜单</h2>
            <ul>
                <li>
                    <span class="name">西湖醋鱼</span>
                    <span class="price">¥ 48</span>
                    <p>西湖醋鱼是一道经典的浙江菜，以西湖水为原料，烹饪出酸甜适口的味道。</p>
                </li>
                <li>
                    <span class="name">东坡肉</span>
                    <span class="price">¥ 38</span>
                    <p>东坡肉是一道著名的浙江菜，以猪肉为原料，烹饪出酥烂的口感。</p>
                </li>
                <li>
                    <span class="name">宁波汤圆</span>
                    <span class="price">¥ 25</span>
                    <p>宁波汤圆是一道传统的浙江甜点，以糯米粉为原料，烹饪出软糯的口感。</p>
                </li>
            </ul>
        </div>
    </div>
    <div class="footer">
