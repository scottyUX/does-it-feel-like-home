        <h2>我们的故事</h2>
        <p>家味餐厅创立于2015年，由一位热爱烹饪的浙江本地人在杭州市中心创办。最初仅有两张桌子和几道家传菜式，经过不懈努力，逐步发展为一家集传统浙菜与现代餐饮理念的家庭餐厅。</p>
        <p>我们的理念是“让每位顾客感受到家的温暖”。因此，我们坚持使用本地季节性食材，保持菜品的原汁原味；同时，我们注重服务细节，让每位来访的客人都能在轻松愉快的氛围中享受美食。</p>
        <p>餐厅内部装饰简约大方，兼具传统江南水乡的雅致与现代简约的舒适，适合家庭聚餐、公司团建以及旅游观光的歇息。</p>
