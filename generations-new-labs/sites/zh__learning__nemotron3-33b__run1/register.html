<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册 - 学途</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.6;color:#333;background:#f9f9f9;}
    .container{max-width:1440px;margin:0 auto;background:#fff;padding:20px;}
    header{background:#004e8a;color:#fff;padding:15px 0;text-align:center;}
    header h1{font-size:28px;margin-bottom:5px;}
    nav{margin-top:10px;}
    nav a{color:#fff;margin:0 15px;text-decoration:none;font-size:16px;}
    .form-section{padding:40px 0;}
    .form-group{margin-bottom:15px;}
    .form-group label{display:block;margin-bottom:5px;font-weight:bold;}
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group select{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;}
    .btn{display:inline-block;background:#ff6600;color:#fff;padding:12px 24px;border-radius:4px;text-decoration:none;font-size:16px;margin-top:10px;}
    footer{background:#222;color:#ddd;text-align:center;padding:20px 0;font-size:14px;}
    @media (max-width:768px){
        .form-section{padding:20px;}
    }
</style>
</head>
<body>
<div class="container">
<header>
<h1>注册</h1>
<nav>
<a href="index.html">首页</a>
<a href="courses.html">课程列表</a>
<a href="about.html">关于我们</a>
</nav>
</header>

<section class="form-section">
<h2>创建账户</h2>
<form>
<div class="form-group">
<label for="username">姓名</label>
<input type="text" id="username" name="username" required>
</div>
<div class="form-group">
<label for="email">邮箱</label>
<input type="email" id="email" name="email" required>
</div>
<div class="form-group">
<label for="phone">电话</label>
<input type="tel" id="phone" name="phone" pattern="\\d{11}" placeholder="请输入11位手机号" required>
</div>
<div class="form-group">
<label for="course">选择课程</label>
<select id="course" name="course" required>
<option value="">-- 请选择 --</option>
<option value="python_basic">Python基础入门</option>
<option value="english_spoken">英语口语提升</option>
<option value="cet4_crash">CET-4考试冲刺</option>
</select>
</div>
<div class="form-group">
<label for="password">密码</label>
<input type="password" id="password" name="password" required minlength="6">
</div>
<button type="submit" class="btn">立即注册</button>
</form>
</section>

<footer>
© 2025 学途 · 版权所有
</footer>
</div>
</body>
</html>
