<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长川银行 - 首页</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #007BFF; color: white; padding: 10px 0; }
        .header-content { width: 1440px; margin: 0 auto; padding: 0 20px; }
        .logo { float: left; }
        .nav { float: right; }
        .nav a { color: white; text-decoration: none; padding: 0 15px; }
        .nav a:hover { text-decoration: underline; }
        .main { margin-top: 20px; }
        .banner { width: 100%; height: 300px; background: url('banner.jpg') no-repeat center center; background-size: cover; }
        .services { margin-top: 20px; }
        .service { width: 30%; float: left; margin: 0 1.67%; padding: 10px; }
        .service img { width: 100%; height: auto; }
        .service h2 { margin: 5px 0; }
        .footer { background-color: #333; color: white; text-align: center; padding: 10px 0; position: relative; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo.png" alt="长川银行">
            </div>
            <div class="nav">
                <a href="index.html">首页</a>
                <a href="personal.html">个人银行服务</a>
                <a href="credit.html">信用卡</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </header>
    <div class="main">
        <div class="banner"></div>
        <div class="services">
            <div class="service">
                <img src="accounts.png" alt="账户服务">
                <h2>账户服务</h2>
                <p>提供多种储蓄和投资账户。</p>
            </div>
            <div class="service">
                <img src="card.png" alt="银行卡服务">
                <h2>银行卡服务</h2>
                <p>多种银行卡选择，满足不同需求。</p>
            </div>
            <div class="service">
                <img src="loan.png" alt="贷款服务">
                <h2>贷款服务</h2>
                <p>个人和小企业贷款，灵活还款计划。</p>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>版权所有 &copy; 长川银行</p>
    </footer>
</body>
</html>
