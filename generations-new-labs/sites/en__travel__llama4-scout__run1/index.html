<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅行旅行</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
        }
        .search-form input[type="text"] {
            width: 50%;
            height: 2em;
            padding: 0.5em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
        }
        .search-form button[type="submit"] {
            width: 20%;
            height: 2em;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>畅行旅行</h1>
    </div>
    <form class="search-form" action="search.html">
        <input type="text" placeholder="目的地">
        <input type="date" placeholder="出发日期">
        <input type="date" placeholder="返回日期">
        <button type="submit">搜索</button>
    </form>
    <div class="footer">
        <p>&copy; 2023 畅行旅行</p>
    </div>
</body>
</html>
