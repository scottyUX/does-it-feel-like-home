<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>畅行旅行 - 酒店详情</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
        .header{background:#fff;padding:20px 0;border-bottom:1px solid #e0e0e0;}
        .header .logo{font-size:28px;font-weight:bold;color:#ff5a5f;text-align:center;}
        .nav{display:flex;justify-content:center;margin-top:10px;}
        .nav a{margin:0 15px;color:#333;text-decoration:none;}
        .nav a:hover{color:#ff5a5f;}
        .container{max-width:1440px;margin:auto;padding:20px;}
        .hotel-detail{background:#fff;padding:20px;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        .hotel-detail img{width:100%;height:320px;object-fit:cover;border-radius:5px;}
        .hotel-detail h2{margin:15px 0;}
        .hotel-detail p{margin:10px 0;color:#777;}
        .hotel-detail .price{font-size:24px;color:#ff5a5f;margin:10px 0;}
        .hotel-detail button{background:#ff5a5f;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;}
        .hotel-detail button:hover{background:#e04e4e;}
        footer{background:#fff;text-align:center;padding:15px;margin-top:30px;border-top:1px solid #e0e0e0;font-size:14px;color:#777;}
        @media (max-width:600px){
            .nav{flex-direction:column;}
            .nav a{margin:5px 0;}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">畅行旅行</div>
        <nav class="nav">
            <a href="index.html">首页</a>
            <a href="search.html">搜索结果</a>
            <a href="booking.html">预订中心</a>
        </nav>
    </header>
    <main class="container">
        <section class="hotel-detail">
            <img src="hotel1.jpg" alt="酒店大图">
            <h2>湖景假日酒店</h2>
            <p>地址：杭州市西湖区湖滨路88号</p>
            <p>星级：★★★★</p>
            <p>入住须知：无烟房、早餐自助、免费Wi-Fi</p>
            <div class="price">价格：¥650/晚</div>
            <button onclick="location.href='booking.html?hotel=湖景假日酒店'">立即预订</button>
        </section>
    </main>
    <footer>
        © 2026 畅行旅行 - 旅游预订服务
    </footer>
</body>
</html>
