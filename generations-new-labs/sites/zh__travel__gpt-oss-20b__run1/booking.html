<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>畅行旅行 - 预订中心</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
        .header{background:#fff;padding:20px 0;border-bottom:1px solid #e0e0e0;}
        .header .logo{font-size:28px;font-weight:bold;color:#ff5a5f;text-align:center;}
        .nav{display:flex;justify-content:center;margin-top:10px;}
        .nav a{margin:0 15px;color:#333;text-decoration:none;}
        .nav a:hover{color:#ff5a5f;}
        .container{max-width:1440px;margin:auto;padding:20px;}
        .booking-form{background:#fff;padding:20px;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        .booking-form h2{margin-bottom:15px;}
        .booking-form label{display:block;margin:10px 0 5px;}
        .booking-form input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;}
        .booking-form button{background:#ff5a5f;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin-top:15px;}
        .booking-form button:hover{background:#e04e4e;}
        footer{background:#fff;text-align:center;padding:15px;margin-top:30px;border-top:1px solid #e0e0e0;font-size:14px;color:#777;}
        @media (max-width:600px){
            .nav{flex-direction:column;}
            .nav a{margin:5px 0;}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">畅行旅行</div>
        <nav class="nav">
            <a href="index.html">首页</a>
            <a href="search.html">搜索结果</a>
            <a href="booking.html">预订中心</a>
        </nav>
    </header>
    <main class="container">
        <section class="booking-form">
            <h2>预订信息</h2>
            <form>
                <label for="hotel">酒店名称</label>
                <input type="text" id="hotel" name="hotel" readonly value="湖景假日酒店">
                <label for="checkin">入住日期</label>
                <input type="date" id="checkin" name="checkin" required>
                <label for="checkout">退房日期</label>
                <input type="date" id="checkout" name="checkout" required>
                <label for="guests">客人人数</label>
                <input type="number" id="guests" name="guests" min="1" max="10" required>
                <button type="button">确认预订</button>
            </form>
        </section>
    </main>
    <footer>
        © 2026 畅行旅行 - 旅游预订服务
    </footer>
</body>
</html>
