<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - 趣聊</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #262626;
        }

        header {
            background-color: #fff;
            padding: 15px;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3897f6;
        }

        .search-bar {
            width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #262626;
            font-weight: bold;
        }

        .profile-header {
            background-color: #fff;
            padding: 20px;
            border-bottom: 1px solid #ccc;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            float: left;
            margin-right: 20px;
        }

        .profile-info {
            overflow: hidden;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-bio {
            color: #666;
            margin-bottom: 10px;
        }

        .profile-stats {
            display: flex;
            margin-bottom: 10px;
        }

        .profile-stats div {
            margin-right: 20px;
        }

        .profile-posts {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin: 10px;
        }

        footer {
            background-color: #fff;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">趣聊</div>
        <input type="text" class="search-bar" placeholder="搜索您感兴趣的人或内容">
        <nav>
            <a href="index.html">首页</a>
            <a href="profile.html">我的主页</a>
            <a href="register.html">注册</a>
        </nav>
    </header>

    <main>
        <div class="profile-header">
            <img class="profile-avatar" src="assets/image-0bfef5c29ec207f4.png" alt="头像">
            <div class="profile-info">
                <div class="profile-name">用户C</div>
                <div class="profile-bio">热爱生活，分享快乐。</div>
                <div class="profile-stats">
                    <div>帖子: 12</div>
                    <div>关注者: 100</div>
                    <div>关注: 50</div>
                </div>
            </div>
        </div>

        <div class="profile-posts">
            <h3>我的帖子</h3>
            <img src="assets/image-a3731e0a021008c6.png" alt="帖子图片">
            <p>这是我的最新帖子内容。</p>
        </div>
    </main>

    <footer>
        &copy; 2023 趣聊 - 版权所有
    </footer>
</body>
</html>
