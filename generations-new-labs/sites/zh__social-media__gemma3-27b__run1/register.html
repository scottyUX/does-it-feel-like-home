<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 趣聊</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #262626;
        }

        header {
            background-color: #fff;
            padding: 15px;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3897f6;
        }

        .search-bar {
            width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #262626;
            font-weight: bold;
        }

        .register-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin: 20px;
            width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-button {
            background-color: #3897f6;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #fff;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">趣聊</div>
        <input type="text" class="search-bar" placeholder="搜索您感兴趣的人或内容">
        <nav>
            <a href="index.html">首页</a>
            <a href="profile.html">我的主页</a>
            <a href="register.html">注册</a>
        </nav>
    </header>

    <main>
        <div class="register-form">
            <h2>注册趣聊</h2>
            <div class="form-group">
                <label class="form-label" for="username">用户名:</label>
                <input type="text" id="username" class="form-input" placeholder="请输入您的用户名">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">邮箱:</label>
                <input type="email" id="email" class="form-input" placeholder="请输入您的邮箱">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码:</label>
                <input type="password" id="password" class="form-input" placeholder="请输入您的密码">
            </div>
            <button class="form-button">注册</button>
            <p>已有账户？ <a href="#">登录</a></p>
        </div>
    </main>

    <footer>
        &copy; 2023 趣聊 - 版权所有
    </footer>
</body>
</html>
