<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>畅行旅行 - 酒店详情</title>
    <style>
        body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333;}
        header{background:#fff;padding:15px 30px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        nav a{margin-right:20px;color:#333;text-decoration:none;font-weight:500;}
        nav a:hover{color:#0077cc;}
        .container{max-width:1200px;margin:20px auto;padding:0 20px;}
        .hotel-header{display:flex;flex-wrap:wrap;align-items:flex-start;}
        .hotel-img{width:100%;max-width:500px;height:300px;background-size:cover;background-position:center;border-radius:8px;}
        .hotel-info{flex:1;margin-left:20px;}
        .hotel-name{font-size:28px;margin:0;}
        .hotel-rating{color:#ffa500;margin-top:5px;}
        .hotel-price{margin-top:10px;font-size:18px;font-weight:600;}
        .description{margin-top:15px;}
        .amenities{margin-top:15px;}
        .amenities ul{list-style:none;padding:0;}
        .amenities li{margin-bottom:5px;}
        .booking-btn{margin-top:20px;}
        .booking-btn a{display:inline-block;padding:12px 24px;background:#0077cc;color:#fff;text-decoration:none;font-weight:500;border-radius:4px;}
        .booking-btn a:hover{background:#005fa3;}
        footer{background:#333;color:#eee;padding:20px 30px;text-align:center;font-size:14px;}
        @media(max-width:768px){
            .hotel-header{flex-direction:column;}
            .hotel-img{margin-bottom:15px;}
            .hotel-info{margin-left:0;}
        }
    </style>
</head>

<header>
    <nav>
        <a href="index.html">首页</a>
