<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长川银行 - 联系我们</title>
<style>
:root{--primary:#0066CC;--secondary:#004C99;--bg:#f5f5f5;--text:#333;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue","Helvetica","Arial",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{background:var(--primary);color:#fff;padding:1rem;}
nav ul{list-style:none;display:flex;gap:1rem;}
nav a{color:#fff;text-decoration:none;font-weight:bold;}
nav a:hover{color:var(--secondary);}
main{max-width:1200px;margin:2rem auto;padding:0 1rem;}
section{margin-bottom:2rem;}
h1{margin-bottom:.5rem;font-size:2.5rem;}
h2{margin-bottom:.5rem;font-size:1.75rem;}
.map{height:300px;background:#ddd;margin-bottom:1rem;}
ul{margin-left:1.5rem;}
form{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;}
input,textarea{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;}
button{grid-column:span 2;background:var(--primary);color:#fff;border:none;padding:.75rem;border-radius:4px;cursor:pointer;}
button:hover{background:var(--secondary);}
footer{background:#333;color:#fff;text-align:center;padding:1rem 0;margin-top:3rem;}
footer a{color:#fff;text-decoration:none;}
@media(max-width:600px){
    header nav ul{flex-direction:column;gap:.5rem;}
    form{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>
<h1>长川银行</h1>
<nav>
<ul>
<li><a href="index.html">首页</a></li>
<li><a href="personal_bank.html">个人银行服务</a></li>
<li><a href="credit_cards.html">信用卡</a></li>
<li><a href="contact.html">联系我们</a></li>
</ul>
</nav>
</header>
<main>
<section>
<h2>联系我们</h2>
<p>无论您是对账户、贷款还是信用卡有任何疑问，欢迎随时与我们取得联系。您可以通过电话、邮件或亲自到访我们的分行。</p>
</section>
<section>
<h2>全国分行网络</h2>
<ul>
<li>北京总部 - 朝阳区建国路5号</li>
<li>上海分行 - 徐汇区漕溪北路18号</li>
<li>广州分行 - 天河区珠江新城花城大道10号</li>
<li>深圳分行 - 南山区科苑路100号</li>
<li>成都分行 - 锦江区春熙路10号</li>
</ul>
</section>
<section>
<h2>在线咨询</h2>
<div class="map">地图预览（示例）</div>
<form>
<label>姓名：</label><input type="text" placeholder="请输入姓名">
<label>电话：</label><input type="tel" placeholder="请输入电话">
<label>邮箱：</label><input type="email" placeholder="请输入邮箱">
<label>留言：</label><textarea rows="4" placeholder="请输入您的问题或建议"></textarea>
<button disabled>提交（演示）</button>
</form>
</section>
</main>
<footer>
<p>© 2024 长川银行. 备案号: 12345678.</p>
</footer>
</body>
</html>
