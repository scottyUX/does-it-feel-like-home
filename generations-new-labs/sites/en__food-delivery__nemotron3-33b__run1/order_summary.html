<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>快送外卖 - 订单摘要</title>
<style>
body{margin:0;font-family:Arial,sans-serif;color:#333;background:#f9f9f9;}
.container{max-width:1200px;margin:auto;padding:0 15px;}
header{display:flex;justify-content:space-between;align-items:center;background:#00695c;color:#fff;padding:10px 20px;}
header .logo{font-size:1.5em;font-weight:bold;}
header nav a{color:#fff;text-decoration:none;margin-left:15px;}
header nav a:hover{text-decoration:underline;}
main{padding:20px 0;}
.order-section{max-width:800px;margin:auto;}
.order-section h2{color:#00695c;border-bottom:2px solid #00695c;padding-bottom:5px;margin-bottom:10px;}
.order-item{display:flex;justify-content:space-between;margin-bottom:10px;padding:5px 0;}
.order-item span{color:#666;}
.total{font-weight:bold;color:#e65100;margin-top:20px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:3px;}
footer{text-align:center;padding:15px;background:#f5f5f5;color:#666;font-size:0.9em;}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">快送外卖</div>
<nav>
<a href="index.html">首页</a>
<a href="about.html">关于我们</a>
<a href="restaurant_list.html">餐厅列表</a>
<a href="order_summary.html">订单帮助</a>
</nav>
</header>

<main>
<section class="order-section">
<h2>订单摘要</h2>
<div id="cart-items"></div>
<div class="total" id="total-price">总价：0元</div>
<a href="index.html"><button style="background:#009688;color:#fff;border:none;padding:8px 12px;border-radius:3px;margin-top:15px;">继续浏览</button></a>
<a href="index.html"><button style="background:#e53935;color:#fff;border:none;padding:8px 12px;border-radius:3px;margin-top:15px;">取消订单</button></a>
</section>
</main>

<footer>
© 2025 快送外卖 成都分部
</footer>
<script>
// Render cart items
function renderCart(){
  const cart = JSON.parse(localStorage.getItem('cartItems')||'[]');
  const container = document.getElementById('cart-items');
  let total = 0;
  if(cart.length===0){
    container.innerHTML='<p>购物车为空</p>';
  }else{
    cart.forEach(item=>{
      const div = document.createElement('div');
      div.className='order-item';
      div.innerHTML='<span>'+item.name+'</span><span>'+item.price+'元</span>';
      container.appendChild(div);
      total+=item.price;
    });
  }
  document.getElementById('total-price').textContent='总价：'+total+'元';
}
renderCart();
</script>
</body>
</html>
