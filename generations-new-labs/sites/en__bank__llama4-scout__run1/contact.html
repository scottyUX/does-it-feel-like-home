<!DOCTYPE html>

    <style>
        body {
            font-family: Arial, sans-serif;

            padding: 0;
        }
        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 1em;
            text-align: center;
        }
        .nav {
            background-color: #f0f0f0;
            padding: 1em;
            text-align: center;
        }
        .nav a {
            color: #337ab7;
            text-decoration: none;
            margin: 0 1em;
        }
        .nav a:hover {
            color: #23527c;
        }
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
        }
        .branch {
            background-color: #f7f7f7;
            padding: 1em;
            margin: 1em;
            border: 1px solid #dddddd;
        }
        .footer {
            background-color: #007bff;

            clear: both;
        }

</head>
<body>
    <div class="header">
        <h1>长川银行</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="personal.html">个人金融</a>
        <a href="credit.html">信用卡</a>
        <a href="contact.html">联系我们</a>

    <div class="main">
        <h2>联系我们</h2>
        <div class="branch">
            <h3>北京分行</h3>
            <p>地址：北京市朝阳区建国路123号</p>

            <input type="text" id="name" name="name"><br><br>
            <label for="email">邮箱：</label>
            <input type="email" id="email" name="email"><br><br>
            <label for="message">留言：</label>
            <textarea id="message" name="message"></textarea><br><br>
            <button>提交</button>

    <div class="footer">
