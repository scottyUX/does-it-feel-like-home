        <h2>国家发改委：今年将继续推进供给侧结构性改革</h2>
        <p>2月22日，国家发改委召开新闻发布会，发布会上相关负责人表示，今年将继续推进供给侧结构性改革。</p>
        <p>供给侧结构性改革是我国经济工作的一项重要任务，旨在通过优化资源配置，提高资源利用效率，推动经济高质量发展。</p>
        <p>国家发改委表示，今年将继续深化供给侧结构性改革，着力抓好以下几个方面的工作：一是继续推进“三去一降一补”工作；二是加快推进新旧动能转换；三是深入推进国有企业改革。</p>
