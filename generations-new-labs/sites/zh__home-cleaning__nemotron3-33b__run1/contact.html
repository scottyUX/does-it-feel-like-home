<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>洁家家政 - 预约清洁</title>
<style>
body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; color:#333;}
.container {max-width:1440px; margin:0 auto; background:#fff; padding:0;}
header {background:#2c3e50; color:#fff; padding:15px 0; text-align:center;}
nav a {color:#fff; margin:0 10px; text-decoration:none; font-weight:bold;}
nav a:hover {text-decoration:underline;}
main {padding:20px;}
section {margin-bottom:30px;}
h2 {color:#2c3e50;}
form {background:#f9f9f9; padding:20px; border:1px solid #ddd; border-radius:4px;}
label {display:block; margin-top:10px; font-weight:bold;}
input, select, textarea {width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;}
button {margin-top:20px; background:#e74c3c; color:#fff; border:none; padding:12px 24px; cursor:pointer; border-radius:4px;}
button:hover {background:#c0392b;}
@media (max-width:768px){
  nav a{display:block; margin:5px 0;}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>洁家家政</h1>
<nav>
<a href="index.html">首页</a>
<a href="services.html">服务项目</a>
<a href="about.html">关于我们</a>
</nav>
</header>

<main>
<section>
<h2>预约清洁服务</h2>
<form action="#" method="post">
<label for="name">姓名</label>
<input type="text" id="name" name="name" required>

<label for="phone">电话</label>
<input type="tel" id="phone" name="phone" required pattern="[0-9]{11,}">

<label for="email">邮箱</label>
<input type="email" id="email" name="email" required>

<label for="service">服务类型</label>
<select id="service" name="service" required>
<option value="">请选择</option>
<option value="日清">日常保洁</option>
<option value="月度">定期保洁</option>
<option value="一次性">一次性深度清洁</option>
</select>

<label for="date">希望服务日期</label>
<input type="date" id="date" name="date" required>

<label for="note">备注信息</label>
<textarea id="note" name="note" rows="4" placeholder="如有特殊需求请说明"></textarea>

<button type="submit">提交预约</button>
</form>
<p style="margin-top:20px; font-size:0.9em; color:#777;">我们将在收到表单后的2小时内与您联系。</p>
</section>
</main>

<footer>
<p>北京洁家家政服务有限公司 &nbsp;|&nbsp; 电话：<span style="color:#ffcc00;">010-12345678</span></p>
</footer>
</div>
</body>
</html>
