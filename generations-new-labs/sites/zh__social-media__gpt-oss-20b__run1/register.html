<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趣聊 | 注册</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f4f4;color:#333}
    .header{background:#fff;padding:15px 30px;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:1.5em;font-weight:bold;color:#ff5a5f}
    .nav a{margin-left:20px;color:#555;text-decoration:none;font-size:1em}
    .nav a:hover{color:#ff5a5f}
    .container{max-width:400px;margin:40px auto;padding:0 15px}
    .form{background:#fff;padding:20px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .form h2{text-align:center;margin-bottom:20px}
    .form-group{margin-bottom:15px}
    .form-group label{display:block;margin-bottom:5px}
    .form-group input{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px}
    .form button{width:100%;background:#ff5a5f;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer}
    .footer{background:#fff;text-align:center;padding:15px;color:#777;font-size:.9em;margin-top:30px;border-top:1px solid #ddd}
    @media(max-width:600px){
        .header{flex-direction:column;align-items:flex-start}
        .nav{margin-top:10px}
    }
</style>
</head>
<body>
<div class="header">
    <div class="logo">趣聊</div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="profile.html">我的主页</a>
        <a href="register.html">注册</a>
    </div>
</div>
<div class="container">
    <form class="form">
        <h2>注册账户</h2>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" placeholder="再次输入密码">
        </div>
        <button type="button">立即注册</button>
    </form>
</div>
<div class="footer">© 2026 趣聊，保留所有权利</div>
</body>
</html>
