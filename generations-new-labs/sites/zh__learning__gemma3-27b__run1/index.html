<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学途 - 提升技能，开启未来</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #3498db;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background-color: #2c3e50;
            color: #fff;
            padding: 0.5rem 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            display: inline-block;
        }
        nav a:hover {
            background-color: #34495e;
        }
        main {
            padding: 2rem;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .course-card {
            background-color: #fff;
            padding: 1rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .course-card h3 {
            margin-top: 0;
        }
        .course-card p {
            margin-bottom: 0;
        }
        .btn {
            display: inline-block;
            background-color: #e74c3c;
            color: #fff;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 5px;
        }
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }

</head>
<body>
    <header>
        <h1>学途</h1>
        <p>提升技能，开启未来</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="courses.html">课程列表</a>
        <a href="register.html">注册</a>
    </nav>

    <main>
        <section class="hero">
            <h1>找到适合你的课程</h1>
            <p>学途提供优质的在线学习课程，帮助你提升语言、计算机技能和考试备考能力。</p>
        </section>

        <section class="course-grid">
            <div class="course-card">
                <h3>Python 编程入门</h3>
                <p>从零开始学习 Python 编程，掌握基本语法和常用库。</p>
                <a href="course_details.html?course=python" class="btn">了解更多</a>
            </div>
            <div class="course-card">
                <h3>英语口语提升</h3>
                <p>通过模拟场景和互动练习，提升英语口语表达能力。</p>
                <a href="course_details.html?course=english" class="btn">了解更多</a>
            </div>
            <div class="course-card">
                <h3>雅思备考</h3>
                <p>系统学习雅思考试技巧，提高考试成绩。</p>
                <a href="course_details.html?course=ielts" class="btn">了解更多</a>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2024 学途
    </footer>
