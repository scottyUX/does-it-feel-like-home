<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洁家家政 - 预约</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        .nav {
            background-color: #444;
            padding: 0.5em;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 1em;
        }
        .nav a:hover {
            color: #ccc;
        }
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
        }
        form {
            background-color: #f7f7f7;
            padding: 1em;
            margin: 1em;
            border: 1px solid #ddd;
            width: 300px;
        }
        form label {
            display: block;
            margin-bottom: 0.5em;
        }
        form input, form textarea {
            width: 100%;
            padding: 0.5em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>洁家家政</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="services.html">服务</a>
        <a href="about.html">关于我们</a>
        <a href="booking.html">预约</a>
    </div>
    <div class="main">
        <h2>预约清洁服务</h2>
        <form>
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="tel">电话：</label>
            <input type="text" id="tel" name="tel"><br><br>
            <label for="address">地址：</label>
            <input type="text" id="address" name="address"><br><br>
            <label for="service">服务类型：</label>
            <select id="service" name="service">
                <option value="基础清洁">基础清洁</option>
                <option value="深度清洁">深度清洁</option>
                <option value="定期清洁">定期清洁</option>
            </select><br><br>
            <label for="date">预约日期：</label>
            <input type="date" id="date" name="date"><br><br>
            <label for="time">预约时间：</label>
            <input type="time" id="time" name="time"><br><br>
            <textarea id="remark" name="remark" placeholder="备注"></textarea><br><br>
            <button type="submit">提交预约</button>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2023 洁家家政</p>
    </div>
</body>
</html>
