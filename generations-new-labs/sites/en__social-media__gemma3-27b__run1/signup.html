<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 趣聊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav {
            background-color: #3498db;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>趣聊</h1>
        <p>发现精彩，分享生活</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="profile.html">个人资料</a>
        <a href="post.html">帖子详情</a>
        <a href="signup.html">注册</a>
    </nav>

    <div class="container">
        <h2>注册</h2>
        <form>
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">邮箱:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">注册</button>
        </form>
    </div>

    <footer>
        &copy; 2024 趣聊. 版权所有。
    </footer>

</body>
</html>
