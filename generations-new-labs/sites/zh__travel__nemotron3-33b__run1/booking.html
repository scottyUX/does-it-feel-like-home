<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预订表单 - 畅行旅行</title>
<style>
body{font-family:Arial,sans-serif;margin:0;color:#333;background:#f9f9f9;}
.container{max-width:1440px;margin:0 auto;padding:20px;}
header{background:#004d7a;color:#fff;padding:15px;text-align:center;}
nav{margin-top:10px;}
nav a{color:#fff;margin:0 15px;text-decoration:none;font-weight:bold;}
nav a:hover{text-decoration:underline;}
main{background:#fff;padding:20px;margin-top:20px;border:1px solid #ddd;}
form{max-width:600px;margin:auto;}
label{display:block;margin-top:10px;}
input, select{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:4px;}
button{margin-top:20px;background:#004d7a;color:#fff;padding:10px 15px;border:none;border-radius:4px;cursor:pointer;width:100%;}
button:hover{background:#003366;}
footer{background:#f0f0f0;text-align:center;padding:10px;margin-top:30px;font-size:0.9em;color:#666;}
@media(max-width:768px){
  .container{max-width:100%;}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>预订表单</h1>
</header>
<nav>
<a href="index.html">首页</a>
<a href="about.html">关于我们</a>
<a href="results.html">目的地</a>
<a href="hotel.html">酒店</a>
<a href="booking.html">预订</a>
</nav>
<main>
<form>
<label for="name">姓名</label>
<input type="text" id="name" name="name" placeholder="请输入您的姓名" required>

<label for="phone">手机号码</label>
<input type="text" id="phone" name="phone" placeholder="请输入您的手机号" required>

<label for="checkin">入住日期</label>
<input type="date" id="checkin" name="checkin" required>

<label for="checkout">离店日期</label>
<input type="date" id="checkout" name="checkout" required>

<label for="room">房型</label>
<select id="room" name="room" required>
<option value="">请选择房型</option>
<option value="标准间">标准间</option>
<option value="高级间">高级间</option>
<option value="套房">套房</option>
</select>

<label for="guests">入住人数</label>
<input type="number" id="guests" name="guests" min="1" value="2" required>

<label for="notes">备注（可选）</label>
<textarea id="notes" name="notes" rows="3" placeholder="特殊需求或注意事项"></textarea>

<button type="submit">提交预订</button>
</form>
</main>
<footer>
© 2025 畅行旅行 旅游预订平台
</footer>
</div>
</body>
</html>
