<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册趣聊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #fff;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .register {
            background-color: #fff;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .register form {
            padding: 10px;
        }
        .register form input {
            width: 100%;
            height: 30px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .register form button {
            width: 100%;
            height: 30px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .register form button:hover {
            background-color: #444;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>趣聊</h1>
    </div>
    <div class="nav">
        <a href=".">首页</a>
        <a href="about.html">关于</a>
        <a href="profile.html">个人主页</a>
        <a href="register.html">注册</a>
    </div>
    <div class="register">
        <h2>注册趣聊</h2>
        <form>
            <input type="text" placeholder="用户名">
            <input type="email" placeholder="邮箱">
            <input type="password" placeholder="密码">
            <button>注册</button>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2023 趣聊</p>
    </div>
</body>
</html>
