        <h2>我们的故事</h2>
        <p>家味餐厅成立于1980年，是杭州本地一家历史悠久的家庭餐厅。我们致力于提供正宗的浙江菜，让每一位顾客都能在家一般的温馨氛围中享受美食。</p>
        <h2>我们的承诺</h2>
        <p>我们承诺使用新鲜食材，坚持传统的烹饪方法，保证每一道菜都色香味俱全。我们期待您的光临，让我们共同创造美好的用餐体验。</p>
