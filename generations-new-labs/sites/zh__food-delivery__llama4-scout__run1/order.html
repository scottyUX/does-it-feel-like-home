<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单确认</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #337ab7;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #23527c;
        }
        .order {
            padding: 20px;
        }
        .order-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .order-item h3 {
            margin-top: 0;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>订单确认</h1>
        </div>
        <div class="nav">
            <a href=".">首页</a>
            <a href="restaurants.html">餐厅列表</a>
            <a href="about.html">关于我们</a>
        </div>
        <div class="order">
            <h2>订单信息</h2>
            <div class="order-item">
                <h3>蜀香园</h3>
                <p>宫保鸡丁 x 1</p>
                <p>水煮鱼 x 1</p>
            </div>
            <p>总价：¥50</p>
            <form>
                <label for="address">收货地址：</label>
                <input type="text" id="address" name="address"><br><br>
                <label for="phone">联系电话：</label>
                <input type="text" id="phone" name="phone"><br><br>
                <button type="button">提交订单</button>
            </form>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2023 快送外卖</p>
    </div>
</body>
</html>
