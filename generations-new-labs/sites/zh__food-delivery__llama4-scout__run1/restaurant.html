<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜀香园</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #337ab7;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #23527c;
        }
        .menu {
            padding: 20px;
        }
        .menu-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .menu-item h3 {
            margin-top: 0;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>蜀香园</h1>
        </div>
        <div class="nav">
            <a href=".">首页</a>
            <a href="restaurants.html">餐厅列表</a>
            <a href="about.html">关于我们</a>
        </div>
        <div class="menu">
            <h2>菜单</h2>
            <div class="menu-item">
                <h3>宫保鸡丁</h3>
                <p>价格：¥20</p>
                <p>描述：鸡丁、花生、辣椒</p>
            </div>
            <div class="menu-item">
                <h3>水煮鱼</h3>
                <p>价格：¥25</p>
                <p>描述：鱼片、豆芽、辣椒</p>
            </div>
            <div class="menu-item">
                <h3>青椒肉丝</h3>
                <p>价格：¥18</p>
                <p>描述：肉丝、青椒、蒜</p>
            </div>
        </div>
        <form>
            <label for="quantity">数量：</label>
            <input type="number" id="quantity" name="quantity"><br><br>
            <label for="remark">备注：</label>
            <textarea id="remark" name="remark"></textarea><br><br>
            <button type="button">加入购物车</button>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2023 快送外卖</p>
    </div>
</body>
</html>
