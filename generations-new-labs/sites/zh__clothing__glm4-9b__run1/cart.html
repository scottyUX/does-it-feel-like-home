<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 购物车</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="logo">可衣</div>
        <div class="nav">
            <a href="index.html">首页</a>
            <a href="products.html">商品列表</a>
            <a href="about.html">关于我们</a>
            <a href="cart.html">购物车</a>
        </div>
    </div>
    <div class="content">
        <h1>购物车</h1>
        <div class="cart">
            <div class="cart-item">
                <img src="product1.jpg" alt="时尚连衣裙">
                <h3>时尚连衣裙</h3>
                <p>¥ 299.00</p>
                <button type="button">删除</button>
            </div>
            <div class="cart-item">
                <img src="product2.jpg" alt="简约衬衫">
                <h3>简约衬衫</h3>
                <p>¥ 199.00</p>
                <button type="button">删除</button>
            </div>
        </div>
        <div class="cart-total">
            <p>总计：¥ 498.00</p>
            <button type="button">结账</button>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2023 可衣</p>
    </div>
</body>
</html>
