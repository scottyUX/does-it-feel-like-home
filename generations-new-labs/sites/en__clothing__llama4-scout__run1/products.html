<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 可衣</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .main {
            padding: 20px;
        }
        .product {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .product img {
            width: 100px;
            height: 150px;
            object-fit: cover;
            margin-right: 20px;
        }
        .product-info {
            display: inline-block;
        }
        .product-info h2 {
            font-size: 18px;
            margin: 10px 0;
        }
        .product-info p {
            margin: 10px 0;
        }
        .footer {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>可衣</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="products.html">商品列表</a>
        <a href="cart.html">购物车</a>
    </div>
    <div class="main">
        <h1>商品列表</h1>
        <div class="product">
            <img src="product1.jpg" alt="product1">
            <div class="product-info">
                <h2>时尚白衬衫</h2>
                <p>¥ 128</p>
                <p>尺码：S,M,L</p>
                <a href="product.html">查看详情</a>
            </div>
        </div>
        <div class="product">
            <img src="product2.jpg" alt="product2">
            <div class="product-info">
                <h2>复古裙子</h2>
                <p>¥ 248</p>
                <p>尺码：S,M,L</p>
                <a href="product.html">查看详情</a>
            </div>
        </div>
        <div class="product">
            <img src="product3.jpg" alt="product3">
            <div class="product-info">
                <h2>经典牛仔裤</h2>
                <p>¥ 188</p>
                <p>尺码：S,M,L</p>
                <a href="product.html">查看详情</a>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>Copyright 2023 可衣</p>
    </div>
</body>
</html>
