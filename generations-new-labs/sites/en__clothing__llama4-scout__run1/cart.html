<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 可衣</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .main {
            padding: 20px;
        }
        .cart-item {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .cart-item h2 {
            font-size: 18px;
            margin: 10px 0;
        }
        .cart-item p {
            margin: 10px 0;
        }
        .footer {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>可衣</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="products.html">商品列表</a>
        <a href="cart.html">购物车</a>
    </div>
    <div class="main">
        <h1>购物车</h1>
        <div class="cart-item">
            <h2>时尚白衬衫</h2>
            <p>¥ 128</p>
            <p>尺码：S</p>
            <button>删除</button>
        </div>
        <div class="cart-item">
            <h2>复古裙子</h2>
            <p>¥ 248</p>
            <p>尺码：M</p>
            <button>删除</button>
        </div>
        <p>总计：¥ 376</p>
        <button>结算</button>
    </div>
    <div class="footer">
        <p>Copyright 2023 可衣</p>
    </div>
</body>
</html>
