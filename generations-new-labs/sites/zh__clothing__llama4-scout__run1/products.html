<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            margin: 20px;
            width: 200px;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .product h2 {
            font-size: 18px;
            margin: 10px 0;
        }
        .product p {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>可衣</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="products.html">商品列表</a>
        <a href="about.html">关于我们</a>
    </div>
    <div class="main">
        <div class="product">
            <img src="product1.jpg" alt="产品1">
            <h2>时尚连衣裙</h2>
            <p>价格：¥200</p>
            <p>尺码：S、M、L</p>
            <p><a href="product.html">查看详情</a></p>
        </div>
        <div class="product">
            <img src="product2.jpg" alt="产品2">
            <h2>职场衬衫</h2>
            <p>价格：¥150</p>
            <p>尺码：S、M、L</p>
            <p><a href="product.html">查看详情</a></p>
        </div>
        <div class="product">
            <img src="product3.jpg" alt="产品3">
            <h2>休闲裤</h2>
            <p>价格：¥100</p>
            <p>尺码：S、M、L</p>
            <p><a href="product.html">查看详情</a></p>
        </div>
    </div>
</body>
</html>
