<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学途 - 注册</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f9f9f9;color:#333}
header{background:#0050b3;color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;margin-left:15px;font-size:1rem}
header a:hover{text-decoration:underline}
.main{max-width:800px;margin:0 auto;padding:40px 20px}
form{background:#fff;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:30px}
h2{text-align:center;margin-bottom:20px}
label{display:block;margin-top:15px;font-weight:bold}
input[type="text"],input[type="email"],input[type="password"]{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;margin-top:5px}
input[type="submit"]{display:block;width:100%;background:#0050b3;color:#fff;padding:12px;border:none;border-radius:4px;margin-top:20px;font-size:1rem}
input[type="submit"]:hover{background:#00408b}
footer{background:#333;color:#ccc;text-align:center;padding:20px;font-size:0.9rem}
</style>
</head>
<body>
<header>
<div class="logo"><a href="index.html"><strong>学途</strong></a></div>
<nav>
<a href="index.html">首页</a>
<a href="courses.html">课程</a>
<a href="register.html">注册</a>
</nav>
</header>
<main class="main">
<form>
<h2>用户注册</h2>
<label>姓名</label>
<input type="text" placeholder="请输入姓名" required>
<label>邮箱</label>
<input type="email" placeholder="请输入邮箱" required>
<label>密码</label>
<input type="password" placeholder="请输入密码" required>
<label>确认密码</label>
<input type="password" placeholder="请再次输入密码" required>
<input type="submit" value="注册账号">
</form>
</main>
<footer>
<p>© 2024 学途在线学习平台 | 联系我们: <a href="mailto:support@xuntu.com" style="color:#ff5722">support@xuntu.com</a></p>
</footer>
</body>
</html>
