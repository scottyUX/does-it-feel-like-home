<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣聊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #fff;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav a:hover {
            color: #ccc;
        }
        .post {
            background-color: #fff;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .post img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }
        .post-content {
            padding: 10px;
        }
        .post-content h2 {
            margin: 0;
        }
        .post-content p {
            margin: 10px 0;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>趣聊</h1>
    </div>
    <div class="nav">
        <a href=".">首页</a>
        <a href="about.html">关于</a>
        <a href="profile.html">个人主页</a>
        <a href="register.html">注册</a>
    </div>
    <div class="post">
        <img src="https://via.placeholder.com/400x200" alt="帖子图片">
        <div class="post-content">
            <h2>这是一个有趣的帖子</h2>
            <p>这是帖子的内容...</p>
            <p>发布者：趣聊用户</p>
        </div>
    </div>
    <div class="post">
        <img src="https://via.placeholder.com/400x200" alt="帖子图片">
        <div class="post-content">
            <h2>另一个帖子</h2>
            <p>这是另一个帖子的内容...</p>
            <p>发布者：趣聊用户</p>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2023 趣聊</p>
    </div>
</body>
</html>
