<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 趣聊</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .register-header { text-align: center; margin-bottom: 2rem; }
        .register-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--primary-color); }
        .register-header p { color: var(--text-secondary); font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color, #d1d5db);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-block {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-block:hover {
            background: var(--primary-hover);
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-footer a:hover { text-decoration: underline; }

        .social-divider {
            margin: 2rem 0;
            position: relative;
            text-align: center;
        }

        .social-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
        }

        .divider-text {
            position: relative;
            background: var(--card-bg);
            padding: 0 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-social:hover { background: var(--bg-color); }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-header">
        <h1>加入趣聊</h1>
        <p>注册账号，开启你的精彩生活分享之旅</p>
    </div>

    <form action="#" onsubmit="return false;">
        <div class="form-group">
            <label for="username" class="form-label">用户名</label>
            <input type="text" id="username" class="form-input" placeholder="设置一个独特的用户名" required>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">电子邮箱</label>
            <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">密码</label>
            <input type="password" id="password" class="form-input" placeholder="至少6位字符" required>
        </div>

        <div class="form-group">
            <label for="confirm" class="form-label">确认密码</label>
            <input type="password" id="confirm" class="form-input" placeholder="再次输入密码" required>
        </div>

        <button type="submit" class="btn-block">注册</button>
    </form>

    <div class="social-divider">
        <span class="divider-text">或者使用社交账号</span>
    </div>

    <div class="social-login">
        <button class="btn-social">微信</button>
        <button class="btn-social">QQ</button>
        <button class="btn-social">微博</button>
        <button class="btn-social">Apple ID</button>
    </div>

    <div class="form-footer">
        已有账号？ <a href="index.html">直接登录</a>
    </div>
</div>

</body>
</html>
