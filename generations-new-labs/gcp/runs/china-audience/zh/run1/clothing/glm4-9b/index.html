<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 首页</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .header { background: #f8f8f8; padding: 10px 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { float: right; }
        .nav a { text-decoration: none; color: #333; margin-left: 20px; }
        .nav a:hover { color: #d93333; }
        .banner { background: #d93333; padding: 30px; text-align: center; color: white; }
        .product-list { padding: 20px; }
        .product-list h2 { margin-bottom: 20px; }
        .product-item { background: white; margin-bottom: 20px; padding: 10px; }
        .product-item img { width: 100%; height: auto; }
        .product-item h3 { margin-top: 0; }
        .footer { background: #f8f8f8; padding: 10px 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">可衣</div>
        <div class="nav">
            <a href="index.html">首页</a>
            <a href="products.html">商品列表</a>
            <a href="about.html">关于我们</a>
            <a href="cart.html">购物车</a>
        </div>
    </div>
    <div class="banner">
        <h1>时尚女装，尽在可衣</h1>
        <p>欢迎光临可衣，为您提供各种风格的女装。</p>
    </div>
    <div class="product-list">
        <h2>热门商品</h2>
        <div class="product-item">
            <img src="product1.jpg" alt="时尚连衣裙">
            <h3>时尚连衣裙</h3>
            <p>¥ 299.00</p>
        </div>
        <div class="product-item">
            <img src="product2.jpg" alt="简约衬衫">
            <h3>简约衬衫</h3>
            <p>¥ 199.00</p>
        </div>
        <div class="product-item">
            <img src="product3.jpg" alt="时尚外套">
            <h3>时尚外套</h3>
            <p>¥ 399.00</p>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2023 可衣</p>
    </div>
</body>
</html>
