<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可衣 - 穿出你的风格</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        nav {
            background-color: #fff;
            padding: 10px;
            text-align: center;

        }

        nav a {

            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
        }

        nav a:hover {
            background-color: #f0f0f0;
        }

        main {
            padding: 20px;
        }

        .featured-products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .product-card {
            width: 22%;
            margin-bottom: 20px;
            background-color: #fff;
            padding: 15px;
            border: 1px solid #eee;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 0;
            font-size: 1.2em;
        }

        .product-card p {
            margin: 5px 0;
        }

        footer {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #eee;
            font-size: 0.8em;

    <header>
