<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - 可衣</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        nav {
            background-color: #fff;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        nav a {
            color: #333;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
        }

        nav a:hover {
            background-color: #f0f0f0;
        }

        main {
            padding: 20px;
        }

        .product-detail {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .product-image {
            width: 45%;
        }

        .product-image img {
            width: 100%;
            height: auto;
        }

        .product-info {
            width: 45%;
        }

        .product-info h2 {
            margin: 0;
        }

        .product-info p {
            margin: 5px 0;
        }

        .size-selection {
            margin-bottom: 10px;
        }

        .size-selection label {
            margin-right: 10px;
        }

        .add-to-cart-button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        footer {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #eee;
            font-size: 0.8em;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>可衣</h1>
        <p>穿出你的风格</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="products.html">商品列表</a>
        <a href="cart.html">购物车</a>
        <a href="about.html">关于我们</a>
    </nav>

    <main>
        <h2>商品详情</h2>
        <div class="product-detail">
            <div class="product-image">
                <img src="https://via.placeholder.com/400x500" alt="连衣裙详情">
            </div>
            <div class="product-info">
                <h2>优雅连衣裙</h2>
                <p>¥199</p>
                <p>这款连衣裙采用优质面料，舒适透气，适合日常穿着和约会。</p>
                <div class="size-selection">
                    <label>尺码:</label>
                    <select>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                    </select>
                </div>
                <button class="add-to-cart-button">加入购物车</button>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2024 可衣.  版权所有.
    </footer>
</body>
</html>
