<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悦容美发美容 - 预约服务</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.6;color:#333;background:#f9f9f9;}
        .container{max-width:800px;margin:auto;padding:20px;}
        header{background:#d33;color:#fff;padding:20px 0;text-align:center;}
        header h1{font-size:2rem;margin-bottom:10px;}
        nav{margin-top:10px;}
        nav a{color:#fff;margin:0 15px;text-decoration:none;font-size:1rem;}
        nav a:hover{text-decoration:underline;}
        form{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        .form-group{margin-bottom:15px;}
        .form-group label{display:block;margin-bottom:5px;font-weight:bold;}
        .form-group input[type="text"],
        .form-group input[type="tel"],
        .form-group select,
        .form-group textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:1rem;}
        .form-group textarea{resize:vertical;min-height:80px;}
        .submit-btn{background:#ff6f61;color:#fff;padding:12px 25px;border:none;border-radius:5px;font-size:1rem;cursor:pointer;width:100%;}
        .submit-btn:hover{background:#e65a50;}
        .note{font-size:0.9rem;color:#666;margin-top:10px;}
        footer{background:#333;color:#fff;padding:20px 0;text-align:center;font-size:0.9rem;margin-top:40px;}
        .footer-links a{color:#ff6f61;margin:0 10px;text-decoration:none;}
        .footer-links a:hover{text-decoration:underline;}
        @media (max-width:768px){
            header h1{font-size:1.5rem;}
            nav a{display:block;margin:10px 0;}
        }
    </style>
</head>
<body>
    <header>
        <h1>预约服务</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="services.html">服务项目</a>
            <a href="about.html">发型师团队</a>
            <a href="appointment.html">预约</a>
        </nav>
    </header>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="phone">手机号码</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}">
        </div>
        <div class="form-group">
            <label for="service">选择服务</label>
            <select id="service" name="service" required>
                <option value="">-- 请选择 --</option>
                <option value="理发">理发</option>
                <option value="染发">染发</option>
                <option value="护肤套餐">护肤套餐</option>
                <option value="造型">造型</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">预约日期</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
            <label for="time">预约时间</label>
            <input type="time" id="time" name="time" required>
        </div>
        <div class="form-group">
            <label for="note">备注（可选）</label>
            <textarea id="note" name="note" placeholder="如特殊需求或时间段"></textarea>
        </div>
        <button type="submit" class="submit-btn">确认预约</button>
        <div class="note">我们将在24小时内与您联系确认预约时间。</div>
    </form>

    <footer>
        <p>广州市天河区天河路88号 电话: 020-1234-5678</p>
        <div class="footer-links">
            <a href="index.html">首页</a>
            <a href="services.html">服务项目</a>
            <a href="about.html">发型师团队</a>
            <a href="appointment.html">预约</a>
        </div>
    </footer>
</body>
</html>
