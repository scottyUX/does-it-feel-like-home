<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悦容美发美容 - 预约</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>悦容美发美容</h1>
        <p>广州专业的理发、染发、护肤服务</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="services.html">服务项目</a>
        <a href="team.html">发型师团队</a>
        <a href="appointment.html">预约</a>
    </nav>

    <div class="container">
        <h2>预约</h2>

        <form>
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name" required>

            <label for="email">邮箱：</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">电话：</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="service">服务项目：</label>
            <select id="service" name="service">
                <option value="理发">理发</option>
                <option value="染发">染发</option>
                <option value="护肤">护肤</option>
                <option value="其他">其他</option>
            </select>

            <label for="date">预约日期：</label>
            <input type="text" id="date" name="date" placeholder="请选择日期">

            <label for="time">预约时间：</label>
            <input type="text" id="time" name="time" placeholder="请选择时间">

            <label for="notes">备注：</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

            <button type="button">提交预约</button>
        </form>
    </div>

    <footer>
        &copy; 2024 悦容美发美容
    </footer>
</body>
</html>
