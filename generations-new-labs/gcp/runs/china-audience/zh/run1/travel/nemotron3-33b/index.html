<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>畅行旅行 - 旅游预订平台</title>
<style>
body{font-family:Arial,sans-serif;margin:0;color:#333;background:#f9f9f9;}
.container{max-width:1440px;margin:0 auto;padding:20px;}
header{background:#004d7a;color:#fff;padding:15px;text-align:center;}
nav{margin-top:10px;}
nav a{color:#fff;margin:0 15px;text-decoration:none;font-weight:bold;}
nav a:hover{text-decoration:underline;}
main{background:#fff;padding:20px;margin-top:20px;border:1px solid #ddd;}
.search-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:20px;}
.search-form input,.search-form button{padding:8px;}
.search-form input{border:1px solid #ccc;border-radius:4px;}
.search-form button{background:#004d7a;color:#fff;border:none;border-radius:4px;cursor:pointer;}
footer{background:#f0f0f0;text-align:center;padding:10px;margin-top:30px;font-size:0.9em;color:#666;}
@media(max-width:768px){
  nav a{display:block;margin:5px 0;}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>畅行旅行</h1>
</header>
<nav>
<a href="index.html">首页</a>
<a href="about.html">关于我们</a>
<a href="results.html">目的地</a>
<a href="hotel.html">酒店</a>
<a href="booking.html">预订</a>
</nav>
<main>
<h1>欢迎使用畅行旅行</h1>
<p>畅行旅行是专注于国内旅游的在线预订平台，帮助您轻松规划度假和周末出游行程。您可以在这里搜索目的地、选择日期、查看酒店价格，并直接完成预订。</p>
<div class="search-form">
<form action="results.html" method="get">
<input type="text" name="destination" placeholder="目的地" required style="flex:1;">
<input type="date" name="checkin" placeholder="入住日期" required style="flex:1;">
<input type="date" name="checkout" placeholder="离店日期" required style="flex:1;">
<input type="number" name="guests" placeholder="人数" min="1" value="2" style="flex:1;">
<button type="submit">搜索</button>
</form>
</div>
<p>在这里开始您的旅行规划，发现更多精彩目的地与特色住宿。</p>
</main>
<footer>
© 2025 畅行旅行 旅游预订平台
</footer>
</div>
</body>
</html>
