<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .search-result {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .result-item {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            width: calc(33.33% - 20px);
        }
        .result-item h2 {
            font-size: 18px;
            margin-top: 0;
        }
        .result-item p {
            margin-bottom: 20px;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>畅行旅行</h1>
    </div>
    <div class="container">
        <h1>搜索结果</h1>
        <div class="search-result">
            <div class="result-item">
                <h2>北京酒店</h2>

            </div>
            <div class="result-item">
                <h2>上海酒店</h2>
                <p>价格：¥600/晚</p>
                <p>地址：上海市浦东新区</p>
                <a href="hotel.html">查看详情</a>
            </div>
            <div class="result-item">
                <h2>广州酒店</h2>
                <p>价格：¥400/晚</p>
                <p>地址：广州市越秀区</p>

            </div>

    </div>
    <div class="footer">
        <p>&copy; 2023 畅行旅行</p>
    </div>
</body>
</html>
