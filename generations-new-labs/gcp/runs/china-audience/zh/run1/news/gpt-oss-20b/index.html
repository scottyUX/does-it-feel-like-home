<!DOCTYPE html>

<head>

<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
  header{background:#003366;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;}
  nav a{color:#fff;text-decoration:none;margin-left:20px;}
  nav a:hover{color:#ffcc00;}
  .toggle{display:none;cursor:pointer;font-size:1.5em;}
  main{max-width:1200px;margin:auto;padding:20px;background:#fff;}
  .headline{margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #ddd;}
  .headline h2{margin:0;font-size:1.5em;color:#003366;}
  .headline p{margin:5px 0 0;line-height:1.6;}
  footer{background:#003366;color:#fff;text-align:center;padding:10px 0;}
  @media (max-width:768px){
    nav a{display:block;margin:10px 0;}
    nav{display:none;}
    .toggle{display:block;}
  }
</style>
</head>
<body>
<header>
  <div>每日视界</div>
  <div class="toggle" onclick="document.getElementById('nav').style.display='block'">&#9776;</div>
  <nav id="nav">

<script>
  window.addEventListener('click',function(e){
    if(e.target.className!='toggle' && e.target.parentNode.id!='nav'){
      document.getElementById('nav').style.display='none';
    }
  });
</script>
</body>
</html>
