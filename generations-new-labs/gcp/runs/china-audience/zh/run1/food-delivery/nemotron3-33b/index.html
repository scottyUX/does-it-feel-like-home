<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>快送外卖 - 成都外卖配送平台</title>
<style>
    body{font-family:Arial,sans-serif;margin:0;padding:0;color:#333;background:#f9f9f9;}
    .container{max-width:1200px;margin:0 auto;padding:20px;}
    header{background:#004d40;color:#fff;padding:15px 0;text-align:center;position:sticky;top:0;z-index:10;}
    nav a{color:#fff;text-decoration:none;margin:0 15px;font-weight:bold;}
    .hero{background:linear-gradient(135deg,#ff6f61,#ff9f43);color:#fff;padding:100px 0;text-align:center;}

    .featured{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;}
    .card{background:#fff;border:1px solid #ddd;border-radius:8px;width:260px;padding:15px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    .card img{width:100%;height:150px;object-fit:cover;margin-bottom:10px;}
    .card h3{margin:10px 0;font-size:1.2em;}
    .card p{font-size:0.9em;color:#666;margin-bottom:10px;}
    .card a{background:#28a745;color:#fff;padding:8px 12px;border-radius:4px;text-decoration:none;display:inline-block;}
    footer{background:#222;color:#ccc;text-align:center;padding:15px 0;margin-top:40px;}
    @media (max-width:768px){
        .container{padding:10px;}
        .hero{padding:60px 0;}
