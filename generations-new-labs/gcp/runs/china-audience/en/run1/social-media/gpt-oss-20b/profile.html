<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趣聊 - 个人主页</title>
<style>
body{margin:0;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;background:#f5f5f5;}
header{background:#ffffff;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:1.8rem;color:#ff5e00;font-weight:bold;}
nav a{margin-left:20px;color:#333;text-decoration:none;font-size:1rem;}
nav a:hover{color:#ff5e00;}
.container{max-width:1000px;margin:20px auto;}
.user-info{background:#ffffff;padding:20px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;align-items:center;}
.avatar-large{width:80px;height:80px;border-radius:50%;margin-right:20px;}
.username{font-size:1.5rem;font-weight:bold;color:#333;}
.posts{margin-top:20px;}
.post{background:#ffffff;padding:15px;margin-bottom:15px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.post-header{display:flex;align-items:center;margin-bottom:10px;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:10px;}
.post-user{font-weight:bold;color:#333;}
.post-time{font-size:.85rem;color:#999;margin-left:10px;}
.post-content{margin-bottom:10px;font-size:1rem;color:#333;}
.post-img{width:100%;height:auto;border-radius:5px;margin-bottom:10px;}
footer{background:#ffffff;padding:20px;text-align:center;color:#999;font-size:.9rem;margin-top:40px;}
</style>
</head>
