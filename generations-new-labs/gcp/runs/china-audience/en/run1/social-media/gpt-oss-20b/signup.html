<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趣聊 - 注册</title>
<style>
body{margin:0;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;background:#f5f5f5;}
header{background:#ffffff;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:1.8rem;color:#ff5e00;font-weight:bold;}
nav a{margin-left:20px;color:#333;text-decoration:none;font-size:1rem;}
nav a:hover{color:#ff5e00;}
.container{max-width:600px;margin:50px auto;background:#ffffff;padding:30px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
h2{text-align:center;color:#333;}
.form-group{margin-bottom:15px;}
label{display:block;margin-bottom:5px;font-size:1rem;color:#333;}
input[type="text"],input[type="email"],input[type="password"]{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:1rem;}
button{width:100%;padding:12px;background:#ff5e00;color:#fff;border:none;border-radius:5px;font-size:1rem;cursor:pointer;}
button:focus{outline:none;}
footer{background:#ffffff;padding:20px;text-align:center;color:#999;font-size:.9rem;margin-top:40px;}
</style>
</head>
<body>
<header>
<div class="logo">趣聊</div>
<nav>
<a href="index.html">首页</a>
<a href="profile.html">个人主页</a>
<a href="post.html">发布</a>
<a href="signup.html">注册</a>
</nav>
</header>
<div class="container">
<h2>立即注册</h2>
<form>
<div class="form-group">
<label for="username">用户名</label>
<input type="text" id="username" placeholder="输入用户名">
</div>
<div class="form-group">
<label for="email">邮箱</label>
<input type="email" id="email" placeholder="输入邮箱">
</div>
<div class="form-group">
<label for="password">密码</label>
<input type="password" id="password" placeholder="输入密码">
</div>
<div class="form-group">
<label for="confirm">确认密码</label>
<input type="password" id="confirm" placeholder="再次输入密码">
</div>
<button>注册</button>
</form>
</div>
<footer>© 2024 趣聊 版权所有</footer>
<script>
document.querySelector('button').addEventListener('click',(e)=>{e.preventDefault();alert('功能暂未实现');});
</script>
</body>
</html>
