<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洁家家政 - 在线预约</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #3498db;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #2980b9;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
        }
        nav a:hover {
            background-color: #3498db;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2196f3;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #3498db;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>洁家家政</h1>
        <p>让您的家焕然一新</p>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="services.html">服务项目</a>
        <a href="about.html">关于我们</a>
        <a href="booking.html">在线预约</a>
    </nav>
    <div class="container">
        <h2>在线预约</h2>
        <p>请填写以下表格，我们将尽快与您联系确认预约。</p>

        <form>
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">电话：</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">邮箱：</label>
            <input type="email" id="email" name="email">

            <label for="address">地址：</label>
            <input type="text" id="address" name="address" required>

            <label for="service">选择服务：</label>
            <select id="service" name="service">
                <option value="daily">日常清洁</option>
                <option value="deep">深度清洁</option>
                <option value="move">搬家清洁</option>
                <option value="custom">定制清洁</option>
            </select>

            <label for="date">预约日期：</label>
            <input type="text" id="date" name="date" placeholder="例如：2024-03-15">

            <label for="time">预约时间：</label>
            <input type="text" id="time" name="time" placeholder="例如：上午9:00 - 12:00">

            <label for="notes">备注：</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

            <button type="button">提交预约</button>
        </form>
    </div>
    <footer>
        &copy; 2024 洁家家政. 版权所有.
    </footer>
</body>
</html>
