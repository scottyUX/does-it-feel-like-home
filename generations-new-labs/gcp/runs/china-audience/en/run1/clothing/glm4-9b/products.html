<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可衣 - 产品列表</title>
<style>
  body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
  .header { background: #f4f4f4; padding: 10px 0; }
  .header-container { width: 1440px; margin: 0 auto; }
  .logo { float: left; font-size: 24px; color: #333; }
  .nav { float: right; }
  .nav a { text-decoration: none; color: #333; padding: 0 20px; }
  .nav a:hover { color: #0066cc; }
  .content { padding: 40px; }
  .content h1 { color: #333; }
  .product-list { padding: 20px 0; }
  .product-item { float: left; width: 30%; margin-bottom: 30px; }
  .product-item img { width: 100%; }
  .product-item-info { margin-top: 10px; }
  .product-item-name { font-size: 18px; }
  .product-item-price { color: #f00; }
  .footer { background: #333; color: white; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-container">
      <div class="logo">可衣</div>
      <div class="nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="products.html">产品列表</a>
        <a href="cart.html">购物车</a>
      </div>
    </div>
  </div>
  <div class="content">
    <h1>产品列表</h1>
    <div class="product-list">
      <div class="product-item">
        <img src="tops.jpg" alt="上衣">
        <div class="product-item-info">
          <h3 class="product-item-name">优雅上衣</h3>
          <p class="product-item-price">¥ 299</p>
        </div>
      </div>
      <div class="product-item">
        <img src="skirts.jpg" alt="裙子">
        <div class="product-item-info">
          <h3 class="product-item-name">时尚裙子</h3>
          <p class="product-item-price">¥ 399</p>
        </div>
      </div>
      <div class="product-item">
        <img src="dresses.jpg" alt="连衣裙">
        <div class="product-item-info">
          <h3 class="product-item-name">优雅连衣裙</h3>
          <p class="product-item-price">¥ 499</p>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <p>版权所有 &copy; 可衣</p>
  </div>
</body>
</html>
