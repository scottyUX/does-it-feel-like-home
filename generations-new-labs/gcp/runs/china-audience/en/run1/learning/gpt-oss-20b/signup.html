<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册 - 学途</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container">
    <h1 class="logo"><a href="index.html">学途</a></h1>
    <nav>
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="courses.html">课程列表</a></li>
        <li><a href="signup.html" class="active">注册</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="signup">
    <div class="container">
      <h2>注册账号</h2>
      <form>
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="请输入姓名" required>

        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="example@example.com" required>

        <label for="pwd">密码</label>
        <input type="password" id="pwd" placeholder="至少 8 位字符" required>

        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" placeholder="再次输入密码" required>

        <button type="submit" class="btn">注册</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p>© 2026 学途在线学习平台</p>
    <p>联系邮箱：support@xuetu.com</p>
  </div>
</footer>
</body>
</html>
