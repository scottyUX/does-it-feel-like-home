<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 1em;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: #f0f0f0;
            padding: 1em;
            text-align: center;
        }
        .nav a {
            color: #337ab7;
            text-decoration: none;
            margin: 0 1em;
        }
        .nav a:hover {
            color: #23527c;
        }
        .signup-form {
            margin: 1em;
            padding: 1em;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .signup-form h2 {
            margin: 0;
        }
        .signup-form label {
            display: block;
            margin: 0.5em 0;
        }
        .signup-form input {
            width: 100%;
            height: 2em;
            margin: 0.5em 0;
            padding: 0.5em;
            border: 1px solid #ccc;
        }
        .signup-form button {
            width: 100%;
            height: 2em;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .signup-form button:hover {
            background-color: #23527c;
        }
        .footer {
            background-color: #007bff;
            color: #ffffff;
            padding: 1em;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>学途</h1>
    </div>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="courses.html">课程</a>
        <a href="signup.html">注册</a>
    </div>
    <h2>注册</h2>
    <form class="signup-form">
        <label>用户名：</label>
        <input type="text">
        <label>邮箱：</label>
        <input type="email">
        <label>密码：</label>
        <input type="password">
        <button>注册</button>
    </form>
    <div class="footer">
        <p>&copy; 2023 学途</p>
    </div>
</body>
</html>
