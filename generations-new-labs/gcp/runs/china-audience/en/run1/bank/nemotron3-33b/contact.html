<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长川银行 - 联系我们</title>
<style>
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333;}
.container{max-width:1440px;margin:0 auto;padding:0 20px;background:#fff;}
header{background:#003366;color:#fff;padding:15px 0;text-align:center;}
nav{background:#0055a0;display:flex;justify-content:center;gap:30px;padding:10px 0;}
nav a{color:#fff;text-decoration:none;font-weight:500;}
.hero{background:#003366;color:#fff;height:200px;display:flex;align-items:center;justify-content:center;}
.hero h1{font-size:30px;margin:0;}
.content{padding:30px 0;}
.section{margin-bottom:40px;}
.section h2{color:#003366;border-bottom:2px solid #e0e0e0;padding-bottom:5px;}
.card{background:#fafafa;border:1px solid #ddd;padding:20px;margin-bottom:20px;border-radius:5px;}
.card h3{color:#003366;margin-top:0;}
footer{background:#222;color:#ccc;text-align:center;padding:15px 0;font-size:14px;}
@media (max-width:768px){.card{flex-basis:calc(50% - 20px);}nav{gap:15px;}}
@media (max-width:480px){.hero{height:150px;}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>长川银行</h1>
</header>
<nav>
<a href="index.html">首页</a>
<a href="about.html">个人银行</a>
<a href="credit.html">信用卡</a>
<a href="contact.html">联系我们</a>
</nav>
<div class="hero">
<h1>联系我们</h1>
</div>
<div class="content">
<section class="section">
<h2>客户服务中心</h2>
<div class="card">
<h3>北京分行</h3>
<p>地址：北京市朝阳区建国路八十八号<br>电话：分行联系电话<br>服务时间：周一至周五 上午九点至下午六点</p>
</div>
<div class="card">
<h3>上海分行</h3>
<p>地址：上海市黄浦区南京东路一百号<br>电话：分行联系电话<br>服务时间：周一至周五 上午九点至下午六点</p>
</div>
<div class="card">
<h3>广州分行</h3>
<p>地址：广州市越秀区北京路六十号<br>电话：分行联系电话<br>服务时间：周一至周五 上午九点至下午六点</p>
</div>
<div class="card">
<h3>成都分行</h3>
<p>地址：成都市锦江区春熙路二百号<br>电话：分行联系电话<br>服务时间：周一至周五 上午九点至下午六点</p>
</div>
</section>
<section class="section">
<h2>在线留言</h2>
<form action="#" method="post" style="max-width:600px;margin:auto;">
<div style="margin-bottom:10px;">
<label for="name" style="display:block;margin-bottom:5px;">姓名：</label>
<input type="text" id="name" name="name" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">
</div>
<div style="margin-bottom:10px;">
<label for="email" style="display:block;margin-bottom:5px;">邮箱：</label>
<input type="email" id="email" name="email" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">
</div>
<div style="margin-bottom:10px;">
<label for="msg" style="display:block;margin-bottom:5px;">留言：</label>
<textarea id="msg" name="msg" rows="4" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;"></textarea>
</div>
<button type="submit" style="background:#003366;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;">提交</button>
</form>
</section>
</div>
<footer>
© 二零二五 长川银行 版权所有
</footer>
</div>
</body>
</html>
