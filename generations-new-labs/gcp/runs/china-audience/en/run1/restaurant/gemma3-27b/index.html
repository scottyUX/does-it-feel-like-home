<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家味餐厅</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
        }

        header {
            background-color: #e07a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            overflow: hidden;
        }

        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .container {
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero img {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
        }

        .featured-dishes {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .dish {
            width: 30%;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .dish img {
            width: 100%;
            border-radius: 5px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        @media screen and (max-width: 600px) {
            nav a {
                float: none;
                width: 100%;
            }
            .dish {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>家味餐厅</h1>
        <p>正宗浙江菜，家的味道</p>
    </header>

    <nav>
        <a href="index.html">首页</a>
        <a href="menu.html">菜单</a>
        <a href="about.html">关于我们</a>
        <a href="reservation.html">预订</a>
    </nav>

    <div class="container">
        <div class="hero">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w+r8P0gCgZ1w4sH80hAAWBAcWJbCj3QAAAABJRU5ErkJggg==" alt="餐厅特色菜">
            <h2>欢迎光临家味餐厅！</h2>
            <p>我们致力于为您提供最地道的浙江菜，让您感受到家的温暖和美味。</p>
        </div>

        <div class="featured-dishes">
            <div class="dish">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w+r8P0gCgZ1w4sH80hAAWBAcWJbCj3QAAAABJRU5ErkJggg==" alt="西湖醋鱼">
                <h3>西湖醋鱼</h3>
                <p>经典浙江菜，酸甜可口。</p>
            </div>
            <div class="dish">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w+r8P0gCgZ1w4sH80hAAWBAcWJbCj3QAAAABJRU5ErkJggg==" alt="东坡肉">
                <h3>东坡肉</h3>
                <p>肥而不腻，入口即化。</p>
            </div>
            <div class="dish">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w+r8P0gCgZ1w4sH80hAAWBAcWJbCj3QAAAABJRU5ErkJggg==" alt="龙井虾仁">
                <h3>龙井虾仁</h3>
                <p>鲜嫩爽滑，清香扑鼻。</p>
            </div>
        </div>
    </div>

    <footer>
        <p>版权所有 © 2024 家味餐厅</p>
    </footer>

</body>
</html>
