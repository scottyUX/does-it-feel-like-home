        <h2>外交部：中方对美国商务部将中国列为“汇率操纵国”表示强烈不满</h2>
        <p>2月22日，外交部召开新闻发布会，发言人表示，中方对美国商务部将中国列为“汇率操纵国”表示强烈不满。</p>
        <p>发言人强调，中方始终坚持人民币汇率由市场决定，人民币汇率在合理均衡水平上保持基本稳定。</p>
        <p>中方呼吁美方尊重国际金融秩序，停止采取单边主义和保护主义措施。</p>
