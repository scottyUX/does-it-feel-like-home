        <h2>财政部：今年将继续实施积极的财政政策</h2>
        <p>2月22日，财政部召开新闻发布会，发布会上相关负责人表示，今年将继续实施积极的财政政策。</p>
        <p>负责人强调，今年将继续加大财政对重点领域的支持力度。</p>
