<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>趣聊 - 首页</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#333;}
        .navbar{background:#fff;padding:10px 20px;display:flex;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.1);}
        .navbar a{margin-right:20px;color:#333;text-decoration:none;font-weight:bold;}
        .navbar a:hover{color:#ff5a5f;}
        .container{max-width:1200px;margin:auto;padding:20px;}
        .post-card{background:#fff;margin-bottom:20px;padding:15px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
        .post-header{display:flex;align-items:center;margin-bottom:10px;}
        .avatar{width:40px;height:40px;border-radius:50%;background:#ccc;margin-right:10px;}
        .username{font-weight:bold;}
        .post-content{margin-bottom:10px;}
        .post-image{width:100%;max-height:400px;object-fit:cover;border-radius:6px;margin:10px 0;}
        .post-actions{display:flex;align-items:center;font-size:14px;color:#666;}
        .post-actions span{margin-right:15px;cursor:pointer;}
        .post-actions span:hover{color:#ff5a5f;}
        .footer{text-align:center;padding:20px;color:#777;font-size:14px;}
        @media(max-width:768px){
            .navbar{flex-direction:column;align-items:flex-start;}
            .navbar a{margin-bottom:5px;}
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">首页</a>
        <a href="profile.html">我的主页</a>
        <a href="signup.html">注册</a>
    </nav>
    <div class="container">
        <h2>最新动态</h2>

        <div class="post-card">
            <div class="post-header">
                <div class="avatar"></div>
                <div class="username">小明</div>
            </div>
            <div class="post-content">今天在咖啡店拍到了超好看的光影，分享给大家！</div>
            <img src="assets/image-f133476839c86a8c.jpg" alt="post image" class="post-image">
            <div class="post-actions">
                <span onclick="toggleLike(this)">👍 赞 28</span>
                <a href="post.html" style="color:#666;text-decoration:none;">💬 评论 5</a>
                <span>🔁 分享</span>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <div class="avatar"></div>
                <div class="username">林晓</div>
            </div>
            <div class="post-content">刚完成一次马拉松训练，感觉超棒！💪</div>
            <img src="assets/image-8ccc67f63fca30fe.jpg" alt="post image" class="post-image">
            <div class="post-actions">
                <span onclick="toggleLike(this)">👍 赞 52</span>
                <a href="post.html" style="color:#666;text-decoration:none;">💬 评论 12</a>
                <span>🔁 分享</span>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <div class="avatar"></div>
                <div class="username">阿伟</div>
            </div>
            <div class="post-content">周末去爬山，风景真的好美呀~ 🌲🌄</div>
            <img src="assets/image-19920bc7d3b2d1da.jpg" alt="post image" class="post-image">
            <div class="post-actions">
                <span onclick="toggleLike(this)">👍 赞 34</span>
                <a href="post.html" style="color:#666;text-decoration:none;">💬 评论 8</a>
                <span>🔁 分享</span>
            </div>
        </div>

    </div>

    <footer class="footer">
        © 2026 趣聊. 保留所有权利。
    </footer>

    <script>
        function toggleLike(el){
            let text = el.textContent;
            if(text.includes('赞')){
                el.textContent = text.replace('赞','已赞');
                el.style.color = '#ff5a5f';
            }else{
                el.textContent = text.replace('已赞','赞');
                el.style.color = '#666';
            }
        }
    </script>
</body>
</html>
