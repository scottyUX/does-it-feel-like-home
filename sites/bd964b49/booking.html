<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约保洁 - 洁家家政</title>
    <style>
        :root {
            --primary-color: #009688;
            --secondary-color: #00796B;
            --accent-color: #FF7043;
            --text-dark: #333;
            --text-light: #666;
            --bg-light: #f9f9f9;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; color: var(--text-dark); background-color: var(--bg-light); }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        .section { padding: 60px 0; }
        
        /* Header */
        header { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .logo span { color: var(--accent-color); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { font-weight: 500; color: var(--text-dark); }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }
        .btn-primary { background: var(--primary-color); color: var(--white); padding: 10px 24px; border-radius: 4px; font-weight: 500; display: inline-block; }
        .btn-primary:hover { background: var(--secondary-color); }

        /* Form Wrapper */
        .form-wrapper { background: var(--white); padding: 40px; border-radius: 10px; box-shadow: var(--shadow); margin-top: -40px; }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h2 { color: var(--text-dark); }
        .form-header p { color: var(--text-light); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; font-family: inherit; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(0, 150, 136, 0.2); }
        
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        .btn-submit { width: 100%; background: var(--accent-color); color: var(--white); padding: 15px; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #E64A19; }

        .success-message { display: none; background: #E8F5E9; color: #2E7D32; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; border: 1px solid #C8E6C9; }

        footer { background: #263238; color: #CFD8DC; padding: 40px 0; margin-top: auto; text-align: center; }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">洁家<span>家政</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">首页</a></li>
                    <li><a href="services.html">服务项目</a></li>
                    <li><a href="about.html">关于我们</a></li>
                    <li><a href="booking.html" class="active">预约保洁</a></li>
                </ul>
            </nav>
            <a href="booking.html" class="btn-primary">立即预约</a>
        </div>
    </header>

    <div class="section">
        <div class="container">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>在线预约保洁服务</h2>
                    <p>请填写以下信息，我们将尽快与您联系确认上门时间。</p>
                </div>

                <form id="bookingForm" onsubmit="handleBooking(event)">
                    <div class="form-group">
                        <label>预约类型 <span style="color:red">*</span></label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="serviceType" value="regular" checked> 日常保洁
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="serviceType" value="deep"> 深度保洁
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="serviceType" value="renovation"> 开荒保洁
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name">您的称呼 <span style="color:red">*</span></label>
                        <input type="text" id="name" class="form-control" placeholder="例如：王先生/李女士" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">联系电话 <span style="color:red">*</span></label>
                        <input type="tel" id="phone" class="form-control" placeholder="请输入您的手机号码" required>
                    </div>

                    <div class="form-group">
                        <label for="address">服务地址 <span style="color:red">*</span></label>
                        <input type="text" id="address" class="form-control" placeholder="北京市朝阳区/海淀区/通州区..." required>
                    </div>

                    <div class="form-group">
                        <label for="date">期望上门日期 <span style="color:red">*</span></label>
                        <input type="date" id="date" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="notes">特殊备注</label>
                        <input type="text" id="notes" class="form-control" placeholder="例如：家里有宠物，需要带鞋套等">
                    </div>

                    <button type="submit" class="btn-submit">提交预约申请</button>

                    <div id="successMessage" class="success-message">
                        <h3>预约提交成功！</h3>
                        <p>我们的客服将在 30 分钟内致电您确认具体上门时间。</p>
                        <p style="margin-top: 10px; font-size: 14px;">您也可以拨打 400-123-4567 直接联系人工服务。</p>
                        <button type="button" class="btn-primary" onclick="location.reload()" style="margin-top: 15px;">返回首页</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 洁家家政服务有限公司 版权所有</p>
        </div>
    </footer>

    <script>
        function handleBooking(e) {
            e.preventDefault();
            // 简单的表单验证模拟
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            
            if(name.length < 2 || phone.length < 11) {
                alert('请填写正确的姓名和手机号');
                return;
            }

            // 模拟提交过程
            const btn = document.querySelector('.btn-submit');
            btn.textContent = '提交中...';
            btn.disabled = true;

            setTimeout(function() {
                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }, 1500);
        }

        // 设置日期选择器最小日期为今天
        const dateInput = document.getElementById('date');
        dateInput.min = new Date().toISOString().split("T")[0];
    </script>
</body>
</html>
