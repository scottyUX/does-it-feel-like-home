        a{text-decoration:none;color:#0078d7}
        header{background:#fff;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center}
        nav a{margin:0 15px;font-weight:500}
        .hero{background:#e0f7fa;padding:60px 20px;text-align:center}

        .product{width:260px;background:#fafafa;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
        .product img{width:100%;height:200px;object-fit:cover}
        .product .info{padding:15px;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between}
        .product .info h3{margin:0 0 10px;font-size:1.1rem}
        .product .info .price{color:#e53935;font-weight:bold;margin-bottom:10px}
        .product .info a{background:#0078d7;color:#fff;padding:8px 12px;border-radius:4px;text-align:center}
        footer{background:#212121;color:#fff;padding:20px;text-align:center;font-size:.9rem}
        @media(max-width:768px){
            .hero h1{font-size:2rem}
            .product{width:45%}
        }
        @media(max-width:480px){
            .product{width:100%}
        }

</head>
