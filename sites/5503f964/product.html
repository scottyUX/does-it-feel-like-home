<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - 可衣</title>
    <style>
        :root {
            --primary-color: #a6937c;
            --bg-color: #faf9f6;
            --text-color: #333;
            --light-text: #666;
            --white: #ffffff;
            --border-color: #e0e0e0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 16px;
        }
        .breadcrumb {
            padding: 20px 0;
            font-size: 14px;
            color: var(--light-text);
        }
        .breadcrumb a {
            color: var(--light-text);
            text-decoration: none;
        }
        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 80px;
        }
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .main-image {
            width: 100%;
            height: 700px;
            background-color: #e8e4e0;
            border-radius: 4px;
        }
        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .thumb {
            height: 100px;
            background-color: #ddd;
            cursor: pointer;
            border-radius: 2px;
        }
        .product-details {
            padding-top: 20px;
        }
        .product-title {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 500;
        }
        .product-description {
            color: var(--light-text);
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .option-group {
            margin-bottom: 30px;
        }
        .option-label {
            display: block;
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .size-options {
            display: flex;
            gap: 10px;
        }
        .size-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .size-btn:hover, .size-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .color-options {
            display: flex;
            gap: 15px;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 1px var(--border-color);
            cursor: pointer;
        }
        .color-btn.active {
            box-shadow: 0 0 0 2px var(--primary-color);
        }
        .add-to-cart {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            padding: 20px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.3s;
        }
        .add-to-cart:hover {
            opacity: 0.9;
        }
        footer {
            background-color: #f0efed;
            padding: 60px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--light-text);
        }
        .footer-links {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .footer-links a {
            color: var(--light-text);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">可衣 KĚ YĪ</a>
                <div class="nav-links">
                    <a href="index.html">首页</a>
                    <a href="shop.html">全部商品</a>
                    <a href="about.html">关于我们</a>
                    <a href="cart.html">购物车</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a> / <a href="shop.html">全部商品</a> / 极简主义白色真丝衬衫
        </div>

        <div class="product-container">
            <div class="product-gallery">
                <div class="main-image"></div>
                <div class="thumb-grid">
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                </div>
            </div>

            <div class="product-details">
                <h1 class="product-title">极简主义白色真丝衬衫</h1>
                <div class="product-price">¥ 459.00</div>
                
                <div class="product-description">
                    这款衬衫采用100%顶级桑蚕丝面料，触感丝滑且透气。采用经典直筒裁剪，既适合搭配西装裤出席正式会议，也适合搭配牛仔裤打造随性的都市风格。细节处采用手工缝制，确保经久耐穿。
                </div>

                <div class="option-group">
                    <span class="option-label">选择颜色</span>
                    <div class="color-options">
                        <div class="color-btn active" style="background-color: #ffffff;"></div>
                        <div class="color-btn" style="background-color: #f5f5dc;"></div>
                        <div class="color-btn" style="background-color: #e0e0e0;"></div>
                    </div>
                </div>

                <div class="option-group">
                    <span class="option-label">选择尺寸</span>
                    <div class="size-options">
                        <button class="size-btn">S</button>
                        <button class="size-btn active">M</button>
                        <button class="size-btn">L</button>
                        <button class="size-btn">XL</button>
                    </div>
                </div>

                <button class="add-to-cart">加入购物车</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="about.html">品牌故事</a>
                <a href="#">配送政策</a>
                <a href="#">退换货指南</a>
                <a href="#">联系我们</a>
            </div>
            <p>&copy; 2024 可衣 (KĚ YĪ) 上海工作室. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
