<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - 趣聊</title>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --text-main: #1F2937;
            --text-light: #6B7280;
            --bg-body: #F3F4F6;
            --bg-card: #FFFFFF;
            --border: #D1D5DB;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 15px 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--text-main); }
        .login-link { color: var(--text-light); font-weight: 500; }
        .login-link:hover { color: var(--primary); }

        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
        .auth-card { background: var(--bg-card); width: 100%; max-width: 480px; padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); }
        
        .auth-title { text-align: center; margin-bottom: 30px; }
        .auth-title h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .auth-title p { color: var(--text-light); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: var(--primary-dark); }
        
        .divider { display: flex; align-items: center; margin: 25px 0; color: var(--text-light); font-size: 0.9rem; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .divider span { padding: 0 10px; }

        .footer { text-align: center; padding: 20px; font-size: 0.9rem; color: var(--text-light); background: var(--bg-card); border-top: 1px solid var(--border); }
        
        .policy-text { font-size: 0.85rem; color: var(--text-light); text-align: center; margin-top: 20px; }
        .policy-text a { color: var(--primary); }

    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <div style="width: 28px; height: 28px; background: var(--primary); border-radius: 6px;"></div>
                <span>趣聊</span>
            </a>
            <a href="index.html" class="login-link">已有账号？去登录</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">
                <h1>加入趣聊</h1>
                <p>注册免费账号，发现你的兴趣圈子</p>
            </div>

            <form action="#" method="post" onsubmit="event.preventDefault(); alert('注册演示成功！');">
                <div class="form-group">
                    <label for="username">昵称</label>
                    <input type="text" id="username" class="form-control" placeholder="取个好听的昵称" required>
                </div>

                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="至少 8 位字符" required>
                </div>
                
                <div class="form-group">
                    <label for="birthday">出生日期</label>
                    <input type="date" id="birthday" class="form-control" required>
                </div>

                <button type="submit" class="submit-btn">注册账号</button>
            </form>

            <div class="policy-text">
                注册即表示您同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>。
            </div>
            
            <div class="divider">
                <span>或者</span>
            </div>
            
            <button class="submit-btn" style="background: white; color: #333; border: 1px solid #ccc;">使用手机号注册</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2023 趣聊 保留所有权利。</p>
    </footer>

</body>
</html>
