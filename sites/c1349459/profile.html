<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 趣聊</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
        }

        .btn-register {
            background-color: var(--primary-color);
            color: white !important;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        .profile-header {
            background: var(--card-bg);
            border-radius: 0 0 24px 24px;
            border: 1px solid var(--border-color);
            border-top: none;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .cover-photo {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            background-image: url('assets/image-29e8bbd8758648f8.jpg');
            background-size: cover;
            background-position: center;
        }

        .profile-info-bar {
            padding: 0 24px 24px 24px;
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-top: -50px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid var(--card-bg);
            background: #eee;
        }

        .user-details {
            padding-bottom: 10px;
            flex-grow: 1;
        }

        .user-details h2 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .user-details p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .profile-stats {
            display: flex;
            gap: 24px;
            padding-bottom: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-weight: 800;
            font-size: 18px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-edit {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        .content-tabs {
            display: flex;
            gap: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab {
            padding: 12px 0;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            position: relative;
        }

        .tab.active {
            color: var(--primary-color);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-color);
            border-radius: 3px 3px 0 0;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .my-post-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .my-post-card:hover {
            transform: translateY(-4px);
        }

        .my-post-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .my-post-body {
            padding: 16px;
        }

        .my-post-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .my-post-text {
            font-size: 14px;
            color: var(--text-muted);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">趣聊</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="profile.html" style="color: var(--primary-color);">我的主页</a>
            <a href="register.html" class="btn-register">加入我们</a>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="cover-photo"></div>
            <div class="profile-info-bar">
                <img src="assets/image-8707539cd22d3f07.svg" class="profile-avatar" alt="My Avatar">
                <div class="user-details">
                    <h2>林小凡</h2>
                    <p>📷 摄影爱好者 | ☕ 咖啡中毒者 | ✈️ 自由行</p>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-value">1.2k</span>
                            <span class="stat-label">粉丝</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">850</span>
                            <span class="stat-label">关注</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">42</span>
                            <span class="stat-label">帖子</span>
                        </div>
                    </div>
                </div>
                <button class="btn-edit">编辑资料</button>
            </div>
        </div>

        <div class="content-tabs">
            <div class="tab active">帖子</div>
            <div class="tab">相册</div>
            <div class="tab">收藏</div>
            <div class="tab">关于</div>
        </div>

        <div class="posts-grid">
            <div class="my-post-card">
                <img src="assets/image-56d28df9c2c22b85.jpg" class="my-post-img" alt="Post">
                <div class="my-post-body">
                    <span class="my-post-title">周末咖啡时光</span>
                    <p class="my-post-text">在这个喧嚣的城市中找到一个安静的角落...</p>
                </div>
            </div>
            <div class="my-post-card">
                <img src="assets/image-9d806fd719942b91.jpg" class="my-post-img" alt="Post">
                <div class="my-post-body">
                    <span class="my-post-title">山顶的日出</span>
                    <p class="my-post-text">凌晨四点的闹钟虽然痛苦，但看到日出的那一刻全部值了。</p>
                </div>
            </div>
            <div class="my-post-card">
                <img src="assets/image-70d5436212a4e077.jpg" class="my-post-img" alt="Post">
                <div class="my-post-body">
                    <span class="my-post-title">秋日的街道</span>
                    <p class="my-post-text">漫步在银杏大道上，金色的叶子铺满了整个地面。</p>
                </div>
            </div>
            <div class="my-post-card">
                <img src="assets/image-cb65afb7bd27fc80.jpg" class="my-post-img" alt="Post">
                <div class="my-post-body">
                    <span class="my-post-title">深夜食堂</span>
                    <p class="my-post-text">有时候简单的面条就能治愈一整天的疲惫。</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
