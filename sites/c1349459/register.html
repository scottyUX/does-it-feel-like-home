<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入趣聊 - 注册账户</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .register-card h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .register-card p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .login-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .feature-list {
            margin-top: 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: left;
        }

        .feature-item {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">趣聊</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="profile.html">我的主页</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="register-card">
            <h2>开启你的趣聊之旅</h2>
            <p>加入数百万年轻人的社交圈，分享生活点滴</p>
            
            <form onsubmit="return false;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" placeholder="请输入个性化的用户名">
                </div>
                <div class="form-group">
                    <label>电子邮箱</label>
                    <input type="email" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label>设置密码</label>
                    <input type="password" placeholder="至少 8 位字符">
                </div>
                <button class="btn-submit">立即创建账户</button>
            </form>

            <div class="login-link">
                已经有账号了？ <a href="profile.html">立即登录</a>
            </div>

            <div class="feature-list">
                <div class="feature-item">✅ 发现志同道合的朋友</div>
                <div class="feature-item">✅ 分享高画质生活瞬间</div>
                <div class="feature-item">✅ 参与热门话题讨论</div>
                <div class="feature-item">✅ 实时接收好友动态</div>
            </div>
        </div>
    </div>

</body>
</html>
