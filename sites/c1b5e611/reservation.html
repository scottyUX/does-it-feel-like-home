<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅座预订 · 云栖竹径 | 在线预约临水包厢与寻访指南</title>
<style>
  :root {
    --bg-paper: #f7f4ed;
    --bg-paper-dark: #efeae0;
    --bg-ink: #1b2220;
    --text-main: #222926;
    --text-muted: #5e6864;
    --text-light: #f4f1ea;
    --cinnabar: #a63429;
    --cinnabar-dark: #85251c;
    --celadon: #486b5c;
    --celadon-light: #dce5e0;
    --gold: #b08d57;
    --gold-light: #d8c39e;
    --border-subtle: #dcd4c6;
    --shadow-soft: 0 10px 30px rgba(27, 34, 32, 0.07);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-paper);
    color: var(--text-main);
    font-family: var(--sans);
    line-height: 1.75;
  }

  a {
    color: inherit;
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .top-notice {
    background-color: var(--bg-ink);
    color: var(--gold-light);
    font-size: 0.85rem;
    padding: 8px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.06em;
  }

  .solar-badge {
    display: inline-block;
    background-color: var(--cinnabar);
    color: #fff;
    padding: 2px 10px;
    border-radius: 2px;
    margin-right: 10px;
    font-family: var(--serif);
    font-size: 0.8rem;
  }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(247, 244, 237, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 40px;
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-seal {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .brand-title {
    font-family: var(--serif);
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--bg-ink);
    line-height: 1.2;
  }

  .brand-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.22em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    font-family: var(--serif);
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    color: var(--text-main);
    padding: 8px 4px;
    position: relative;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--cinnabar);
    font-weight: 600;
  }

  .nav-links a.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--cinnabar);
  }

  .btn-reserve {
    background-color: var(--cinnabar);
    color: #fff;
    font-family: var(--serif);
    padding: 10px 24px;
    border-radius: 2px;
    letter-spacing: 0.15em;
    font-size: 0.95rem;
  }

  .page-banner {
    background: var(--bg-ink);
    color: var(--text-light);
    padding: 64px 32px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }

  .page-banner h1 {
    font-family: var(--serif);
    font-size: 2.5rem;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    color: var(--gold-light);
  }

  .page-banner p {
    max-width: 680px;
    margin: 0 auto;
    color: #b8c2be;
  }

  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 72px 32px;
  }

  .booking-layout {
    display: grid;
    grid-template-columns: 1.25fr 0.75fr;
    gap: 44px;
    align-items: start;
  }

  .form-card {
    background: #fff;
    border: 1px solid var(--border-subtle);
    padding: 44px;
    box-shadow: var(--shadow-soft);
  }

  .form-card h2 {
    font-family: var(--serif);
    font-size: 1.75rem;
    color: var(--bg-ink);
    margin-bottom: 8px;
    letter-spacing: 0.1em;
  }

  .form-subtitle {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  label {
    display: block;
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--bg-ink);
    margin-bottom: 8px;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-paper);
    font-family: var(--sans);
    font-size: 0.95rem;
    color: var(--text-main);
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--cinnabar);
    background: #fff;
  }

  .checkbox-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 0.9rem;
    cursor: pointer;
  }

  .checkbox-label input {
    width: auto;
  }

  .submit-btn {
    width: 100%;
    background: var(--cinnabar);
    color: #fff;
    border: none;
    padding: 15px;
    font-family: var(--serif);
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  .submit-btn:hover {
    background: var(--cinnabar-dark);
  }

  /* 预订成功回执 */
  .confirmation-box {
    display: none;
    background: #f4f8f6;
    border: 2px solid var(--celadon);
    padding: 36px;
    text-align: center;
  }

  .confirmation-box h3 {
    font-family: var(--serif);
    font-size: 1.7rem;
    color: var(--celadon);
    margin-bottom: 12px;
  }

  .receipt-details {
    text-align: left;
    background: #fff;
    padding: 20px;
    border: 1px dashed var(--border-subtle);
    margin: 20px 0;
    font-size: 0.94rem;
  }

  .receipt-details p {
    margin-bottom: 8px;
  }

  /* 右侧礼遇与须知 */
  .side-info {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .info-box {
    background: #fff;
    border: 1px solid var(--border-subtle);
    padding: 30px;
    box-shadow: var(--shadow-soft);
  }

  .info-box h3 {
    font-family: var(--serif);
    font-size: 1.3rem;
    color: var(--bg-ink);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-subtle);
    letter-spacing: 0.1em;
  }

  .info-list {
    list-style: none;
  }

  .info-list li {
    font-size: 0.92rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 16px;
    position: relative;
  }

  .info-list li::before {
    content: "·";
    position: absolute;
    left: 0;
    color: var(--cinnabar);
    font-weight: bold;
  }

  /* 寻访地图区块 */
  .map-section {
    background: var(--bg-paper-dark);
    border-top: 1px solid var(--border-subtle);
  }

  .map-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 40px;
    align-items: center;
  }

  .footer {
    background-color: var(--bg-ink);
    color: var(--text-light);
    padding: 72px 32px 36px;
    border-top: 4px solid var(--gold);
  }

  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
    gap: 40px;
    padding-bottom: 48px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .footer-title {
    font-family: var(--serif);
    font-size: 1.35rem;
    letter-spacing: 0.15em;
    color: var(--gold-light);
    margin-bottom: 18px;
  }

  .footer-col p,
  .footer-col li {
    color: #b8c2be;
    font-size: 0.92rem;
    margin-bottom: 10px;
    list-style: none;
  }

  .footer-bottom {
    max-width: 1200px;
    margin: 28px auto 0;
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: #7d8984;
    flex-wrap: wrap;
    gap: 12px;
  }

  @media (max-width: 960px) {
    .booking-layout,
    .form-grid,
    .map-grid,
    .footer-inner {
      grid-template-columns: 1fr;
    }
    .navbar {
      padding: 14px 20px;
      height: auto;
      flex-wrap: wrap;
      gap: 12px;
    }
    .nav-links {
      width: 100%;
      justify-content: center;
      order: 3;
      gap: 18px;
    }
  }
</style>
</head>
