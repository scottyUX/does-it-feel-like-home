<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 畅行旅行</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #ff6600;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo span {
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            margin-bottom: 2rem;
            text-align: center;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            list-style: none;
        }

        .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-bottom: 3px solid var(--border-color);
            color: var(--text-light);
            font-weight: 500;
        }

        .step.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .form-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-title {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--bg-light);
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .summary-box {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .summary-total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .submit-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: #e55c00;
        }

        footer {
            background-color: #222;
            color: #aaa;
            padding: 2rem 1rem;
            text-align: center;
            margin-top: 4rem;
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span>畅行</span> 旅行
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="results.html">热门目的地</a></li>
                    <li><a href="#">我的订单</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>确认预订</h1>

        <ul class="step-indicator">
            <li class="step active">填写信息</li>
            <li class="step">支付订单</li>
            <li class="step">完成</li>
        </ul>

        <form action="#" method="post" onsubmit="return false;">
            <div class="form-card">
                <h3 class="form-title">入住人信息</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>入住人姓名</label>
                        <input type="text" placeholder="请输入真实姓名" required>
                    </div>
                    <div class="form-group">
                        <label>手机号码</label>
                        <input type="tel" placeholder="用于接收确认短信" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>电子邮箱</label>
                        <input type="email" placeholder="用于接收预订确认单">
                    </div>
                    <div class="form-group">
                        <label>入住人数</label>
                        <select>
                            <option>2 位成人</option>
                            <option>1 位成人</option>
                            <option>1 位成人 + 1 位儿童</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h3 class="form-title">订单详情</h3>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>酒店名称</span>
                        <span>杭州西湖畔度假酒店</span>
                    </div>
                    <div class="summary-row">
                        <span>房型</span>
                        <span>豪华湖景大床房</span>
                    </div>
                    <div class="summary-row">
                        <span>入住日期</span>
                        <span>2023-10-15 (周日)</span>
                    </div>
                    <div class="summary-row">
                        <span>退房日期</span>
                        <span>2023-10-16 (周一)</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>应付总额</span>
                        <span style="color:var(--secondary-color);">¥1,288.00</span>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h3 class="form-title">支付条款</h3>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 1.5rem;">
                    入住时请在前台出示预订确认短信或订单号。酒店保留在入住前要求提供信用卡担保的权利。免费取消政策：入住前 24 小时免费取消，逾期收取首晚房费。
                </p>
                <button type="submit" class="submit-btn">确认并支付</button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2023 畅行旅行。保留所有权利。 | 关于我们 | 隐私政策</p>
    </footer>

</body>
</html>
