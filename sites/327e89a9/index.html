<!DOCTYPE html>

    <style>

        header{background:#2c3e50;color:#fff;padding:20px 0;}

        nav a{color:#fff;margin:0 15px;text-decoration:none;font-size:16px;}

        .service-item h3{margin:15px 0 10px;}
        .cta{background:#e74c3c;color:#fff;padding:40px 0;text-align:center;}
        .cta button{background:#c0392b;color:#fff;border:none;padding:15px 30px;font-size:18px;border-radius:5px;cursor:pointer;}
        .cta button:hover{background:#a93226;}
        footer{background:#2c3e50;color:#bbb;padding:20px 0;text-align:center;font-size:14px;}
        @media(max-width:768px){
            .services-preview{flex-direction:column;align-items:center;}
