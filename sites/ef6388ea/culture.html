<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化与生活 - 观潮新闻</title>
<style>
:root {
  --brand-red: #c8161d;
  --brand-red-dark: #9e0e14;
  --culture-ochre: #9c5323;
  --ink-black: #17191c;
  --ink-gray: #4e5562;
  --muted-gray: #88909e;
  --bg-page: #f6f4f0;
  --bg-card: #ffffff;
  --bg-subtle: #fbf9f5;
  --border-color: #e6e1d6;
  --font-scale: 1;
  --radius-sm: 4px;
  --radius-md: 8px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
}

body.dark-mode {
  --ink-black: #eef0f4;
  --ink-gray: #b2b8c4;
  --muted-gray: #78808f;
  --bg-page: #111317;
  --bg-card: #1b1e24;
  --bg-subtle: #232730;
  --border-color: #2e333d;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background-color: var(--bg-page);
  color: var(--ink-black);
  line-height: 1.65;
  font-size: calc(15px * var(--font-scale));
}

a {
  color: inherit;
  text-decoration: none;
}

a:hover {
  color: var(--brand-red);
}

ul {
  list-style: none;
}

.container {
  max-width: 1220px;
  margin: 0 auto;
  padding: 0 18px;
}

.top-bar {
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
  color: var(--ink-gray);
}

.top-bar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 38px;
}

.top-bar-left,
.top-bar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.util-btn {
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  color: var(--ink-gray);
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
}

.brand-header {
  background-color: var(--bg-card);
  padding: 18px 0;
}

.brand-header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-title {
  font-size: 26px;
  font-weight: 800;
}

.channel-badge {
  background: rgba(156, 83, 35, 0.12);
  color: var(--culture-ochre);
  padding: 3px 10px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 15px;
}

.main-nav {
  background: var(--brand-red);
  color: #ffffff;
  margin-bottom: 22px;
}

.nav-list {
  display: flex;
  flex-wrap: wrap;
}

.nav-item a {
  display: block;
  padding: 12px 22px;
  color: #ffffff;
  font-weight: 600;
  font-size: 16px;
}

.nav-item a:hover,
.nav-item a.active {
  background: var(--brand-red-dark);
}

/* 节气与人文横幅 */
.solar-banner {
  background: linear-gradient(120deg, #3c2618 0%, #6b3e23 100%);
  color: #f9f3e8;
  border-radius: var(--radius-md);
  padding: 26px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
  align-items: center;
}

@media (max-width: 760px) {
  .solar-banner {
    grid-template-columns: 1fr;
  }
}

.solar-tag {
  display: inline-block;
  background: rgba(255, 214, 102, 0.2);
  border: 1px solid #ffd666;
  color: #ffd666;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.solar-banner h1 {
  font-size: calc(24px * var(--font-scale));
  margin-bottom: 10px;
  line-height: 1.35;
}

.solar-banner p {
  font-size: 14px;
  color: #e6dac8;
}

.culture-grid {
  display: grid;
  grid-template-columns: 1fr 350px;
  gap: 24px;
  margin-bottom: 36px;
}

@media (max-width: 920px) {
  .culture-grid {
    grid-template-columns: 1fr;
  }
}

.culture-box,
.side-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 22px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
}

.section-heading {
  font-size: 19px;
  font-weight: 800;
  padding-left: 10px;
  border-left: 4px solid var(--culture-ochre);
  margin-bottom: 18px;
}

.cul-item {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-color);
}

.cul-item:last-child {
  border-bottom: none;
}

.cul-item h3 {
  font-size: calc(17px * var(--font-scale));
  margin-bottom: 8px;
}

.cul-item p {
  font-size: calc(14px * var(--font-scale));
  color: var(--ink-gray);
  margin-bottom: 8px;
}

.cul-meta {
  font-size: 12px;
  color: var(--muted-gray);
}

.exhibit-item {
  padding: 12px 0;
  border-bottom: 1px dashed var(--border-color);
}

.exhibit-item:last-child {
  border-bottom: none;
}

.exhibit-loc {
  font-size: 12px;
  font-weight: 700;
  color: var(--culture-ochre);
}

.exhibit-name {
  font-size: 14px;
  font-weight: 700;
  margin: 2px 0;
}

.exhibit-date {
  font-size: 12px;
  color: var(--muted-gray);
}

.site-footer {
  background: #181a1f;
  color: #9ca3af;
  padding: 28px 0;
  text-align: center;
  font-size: 13px;
