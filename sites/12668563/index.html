<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快送外卖 - 成都便捷美食配送</title>
    <style>
        :root {
            --primary-color: #ff4d4f;
            --secondary-color: #ff7875;
            --bg-color: #f5f5f5;
            --text-color: #333;
            --light-text: #666;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/image-65e4cb7ca96f5fbe.jpg');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .search-bar {
            background: var(--white);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow);
        }

        .search-bar input {
            flex: 1;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            outline: none;
            border-radius: 50px;
        }

        .search-bar button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-bar button:hover {
            background-color: var(--secondary-color);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .category-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
        }

        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .category-img {
            height: 180px;
            width: 100%;
            object-fit: cover;
        }

        .category-info {
            padding: 1.5rem;
        }

        .category-info h3 {
            margin: 0;
            font-size: 1.25rem;
        }

        footer {
            background-color: #333;
            color: #ccc;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 4rem;
        }

        .footer-links {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            color: var(--white);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🚀 快送外卖</a>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="restaurants.html">所有餐厅</a></li>
                    <li><a href="checkout.html">我的订单</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero">
        <h1>想吃什么？我们为你送到</h1>
        <p style="font-size: 1.2rem; margin-bottom: 2rem;">成都市区全覆盖，最快 20 分钟送达</p>
        <div class="search-bar">
            <input type="text" placeholder="输入美食名称或餐厅...">
            <button onclick="location.href='restaurants.html'">搜索</button>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <h2>探索美食分类</h2>
            <p>为你精选的成都热门美食</p>
        </div>

        <div class="categories-grid">
            <a href="restaurants.html" class="category-card">
                <img src="assets/image-1aabb1b190331fe7.jpg" alt="川菜" class="category-img">
                <div class="category-info">
                    <h3>🌶️ 经典川味</h3>
                    <p>麻辣鲜香，正宗成都味道</p>
                </div>
            </a>
            <a href="restaurants.html" class="category-card">
                <img src="assets/image-a4b7bc65c41b44b2.jpg" alt="快餐" class="category-img">
                <div class="category-info">
                    <h3>🍱 快捷快餐</h3>
                    <p>办公午餐首选，营养高效</p>
                </div>
            </a>
            <a href="restaurants.html" class="category-card">
                <img src="assets/image-0ca48c47e21a51d5.jpg" alt="甜品" class="category-img">
                <div class="category-info">
                    <h3>🍰 甜品饮品</h3>
                    <p>下午茶时光，甜蜜陪伴</p>
                </div>
            </a>
            <a href="restaurants.html" class="category-card">
                <img src="assets/image-3fcf0e5f10167661.jpg" alt="健康食" class="category-img">
                <div class="category-info">
                    <h3>🥗 健康轻食</h3>
                    <p>低卡低脂，呵护你的身体</p>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">关于我们</a>
            <a href="#">配送政策</a>
            <a href="#">加盟商家</a>
            <a href="#">联系客服</a>
        </div>
        <p>&copy; 2023 快送外卖 (Chengdu Fast Delivery). All rights reserved.</p>
    </footer>

</body>
</html>
