    :root {
      --bg-paper: #FAF7F2;
      --bg-warm: #F3EDE2;
      --bg-card: #FFFFFF;
      --text-ink: #242321;
      --text-muted: #6E6A63;
      --accent-jade: #3B5B4F;
      --accent-lotus: #9E6B62;
      --border-subtle: #E5DEC9;
      --shadow-soft: 0 10px 30px rgba(36, 35, 33, 0.06);
      --radius-sm: 4px;
      --radius-md: 8px;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: var(--font-sans);
      line-height: 1.75;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    .serif { font-family: var(--font-serif); }

    .top-bar {
      background-color: var(--accent-jade);
      color: #F4EFE6;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 9px 16px;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 28px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-logo-mark {
      width: 38px; height: 38px;
      border: 1.5px solid var(--accent-jade); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-size: 18px;
      color: var(--accent-jade); background: var(--bg-warm);
    }
    .brand-title { font-family: var(--font-serif); font-size: 24px; letter-spacing: 0.18em; font-weight: 600; }
    .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.15em; display: block; margin-top: -4px; }
    .main-nav { display: flex; align-items: center; gap: 36px; }
    .nav-link { font-size: 15px; letter-spacing: 0.1em; padding: 6px 0; }
    .nav-link.active { color: var(--accent-jade); font-weight: 500; border-bottom: 1.5px solid var(--accent-jade); }
    .action-btn {
      font-size: 14px; color: var(--text-ink);
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--border-subtle); background: var(--bg-card);
    }
    .badge-count { background: var(--accent-jade); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 99px; }

    .page-banner {
      background: var(--bg-warm);
      border-bottom: 1px solid var(--border-subtle);
      padding: 52px 28px;
      text-align: center;
    }
    .page-banner h1 { font-family: var(--font-serif); font-size: 34px; letter-spacing: 0.12em; font-weight: 500; margin-bottom: 10px; }
    .page-banner p { color: var(--text-muted); font-size: 15px; max-width: 660px; margin: 0 auto; }
