<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 可衣</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #2d2d2d;
            background: #fff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-bar {
            background: #f8f5f2;
            text-align: center;
            padding: 10px 20px;
            font-size: 13px;
            color: #666;
            letter-spacing: 1px;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 72px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #2d2d2d;
        }

        .logo span {
            color: #c4956a;
        }

        nav {
            display: flex;
            gap: 36px;
        }

        nav a {
            font-size: 15px;
            color: #555;
            transition: color 0.3s;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover,
        nav a.active {
            color: #2d2d2d;
            border-bottom-color: #c4956a;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-icon svg {
            width: 24px;
            height: 24px;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: #c4956a;
            color: #fff;
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-header {
            background: #f8f5f2;
            padding: 48px 40px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
        }

        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 40px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 20px;
            padding: 24px;
            border: 1px solid #f0f0f0;
            background: #fff;
            transition: box-shadow 0.3s;
        }

        .cart-item:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .cart-item-image {
            width: 120px;
            height: 140px;
            background: #f5f0eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-image span {
            font-size: 40px;
            opacity: 0.5;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cart-item-info h3 {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .cart-item-info .variant {
            font-size: 13px;
            color: #999;
            margin-bottom: 4px;
        }

        .cart-item-info .price {
            font-size: 18px;
            color: #c4956a;
            font-weight: 500;
            margin-top: 8px;
        }

        .cart-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
        }

        .remove-btn {
            font-size: 13px;
            color: #bbb;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
        }

        .remove-btn:hover {
            color: #e74c3c;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .qty-btn:hover {
            background: #f5f0eb;
        }

        .qty-input {
            width: 48px;
            height: 32px;
            text-align: center;
            border: 1px solid #ddd;
            border-left: none;
            border-right: none;
            font-size: 14px;
            outline: none;
        }

        .cart-item-subtotal {
            font-size: 16px;
            font-weight: 500;
            color: #2d2d2d;
        }

        .cart-summary {
            background: #faf8f5;
            padding: 32px;
            position: sticky;
            top: 100px;
        }

        .cart-summary h2 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
        }

        .summary-row.total {
            font-size: 18px;
            color: #2d2d2d;
            font-weight: 600;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #ddd;
        }

        .summary-row .discount {
            color: #e74c3c;
        }

        .summary-row .free {
            color: #27ae60;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: #c4956a;
            color: #fff;
            border: none;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background: #b0845c;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
            transition: color 0.3s;
        }

        .continue-shopping:hover {
            color: #c4956a;
        }

        .coupon-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .coupon-section h4 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #555;
        }

        .coupon-input-group {
            display: flex;
            gap: 8px;
        }

        .coupon-input-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            font-size: 13px;
            outline: none;
        }

        .coupon-input-group input:focus {
            border-color: #c4956a;
        }

        .coupon-input-group button {
            padding: 10px 20px;
            background: #2d2d2d;
            color: #fff;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .coupon-input-group button:hover {
            background: #c4956a;
        }

        .cart-tips {
            margin-top: 24px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eee;
            font-size: 12px;
            color: #999;
            line-height: 2;
        }

        .cart-tips h5 {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }

        footer {
            background: #1a1a1a;
            color: #ccc;
            padding: 60px 40px 30px;
            margin-top: 60px;
        }

        .footer-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 48px;
            margin-bottom: 40px;
        }

        .footer-brand .logo {
            color: #fff;
            margin-bottom: 16px;
        }

        .footer-brand p {
            font-size: 13px;
            line-height: 1.8;
            color: #999;
        }

        .footer-col h4 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .footer-col a {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
            transition: color 0.3s;
        }

        .footer-col a:hover {
            color: #c4956a;
        }

        .footer-bottom {
            max-width: 1440px;
            margin: 0 auto;
            padding-top: 24px;
            border-top: 1px solid #333;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 1024px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header-inner {
                padding: 0 20px;
            }
            nav {
                display: none;
            }
            .cart-container {
                padding: 20px;
            }
            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
            }
            .cart-item-image {
                width: 80px;
                height: 100px;
            }
            .cart-item-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                align-items: center;
            }
            .footer-inner {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
