*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F4EFE5;--paper2:#ECE4D3;--card:#FBF8F0;--ink:#221D17;--mut:#6E6455;--line:#D9CFBB;--acc:#A63E2A;--sage:#78806C;--rose:#C79A8B;--camel:#B98A5C;

html{scroll-behavior:smooth}

ul{list-style:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.bar{background:var(--ink);color:#E9E1CF;font-size:13px;letter-spacing:.12em}
.tick{overflow:hidden}

.ti{padding:9px 0 9px 34px;white-space:nowrap}

@keyframes tick{to{transform:translateX(-50%)}}

.logo{display:flex;align-items:center;gap:12px}

nav{display:flex;gap:26px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font-size:15px;letter-spacing:.2em;white-space:nowrap;position:relative;padding:4px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .35s}
nav a:hover::after,nav a.on::after{transform:scaleX(1);transform-origin:left}

.bag{position:relative;display:flex;align-items:center;gap:7px}

.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.pg-head{padding:70px 0 10px;position:relative;overflow:hidden}

.stage{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:var(--gc,#E7DCC4);position:relative;overflow:hidden;transition:background .5s}

.pinfo{padding:16px 16px 12px;flex:1}

.price{font-family:var(--num);font-size:20px}

.sw.on{outline:2px solid var(--acc)}

.news{background:var(--ink);color:#EDE4D2}
.news .in{max-width:1280px;margin:0 auto;padding:64px 24px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.news h2{font-family:var(--serif);font-size:26px;letter-spacing:.12em}
.news p{color:#B9AF9C;font-size:14px;margin-top:6px}
.btn{display:inline-block;background:var(--acc);color:#fff;padding:13px 34px;font-size:14px;letter-spacing:.3em;transition:.3s;border:1px solid var(--acc)}

footer{background:#1B1712;color:#B9AF9C}
.ft{max-width:1280px;margin:0 auto;padding:64px 24px 44px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:40px}

.ft a{display:block;font-size:13.5px;padding:5px 0;transition:.25s}

.fbot{border-top:1px solid #35302A;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto;padding:20px 24px;font-size:12px;color:#8A7F6B}
@media(max-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}.ft{grid-template-columns:1fr 1fr}}

@media(max-width:520px){.grid{grid-template-columns:1fr}.ft{grid-template-columns:1fr}.toolbar{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
